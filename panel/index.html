<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#fcf8f2">
<title>Pedidos · Wuuff Puppy</title>
<style>
@font-face{font-family:'Fredoka One';src:url(/assets/fonts/fredoka-one-latin-400-normal.woff2) format('woff2');font-display:swap}
@font-face{font-family:'Nunito';src:url(/assets/fonts/nunito-latin-400-normal.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Nunito';src:url(/assets/fonts/nunito-latin-700-normal.woff2) format('woff2');font-weight:700;font-display:swap}
@font-face{font-family:'Nunito';src:url(/assets/fonts/nunito-latin-800-normal.woff2) format('woff2');font-weight:800;font-display:swap}
:root{--fondo:#fcf8f2;--navy:#2d4375;--azul:#4964af;--naranja:#ff7d57;--lima:#d5d50c;--rosa:#f7d0e8;--crema:#feeee8;--gris:#6b7a99;--borde:#ece3d6}
*{box-sizing:border-box}
html,body{margin:0;background:var(--fondo);color:var(--navy);font-family:'Nunito',system-ui,sans-serif;font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,.titulo{font-family:'Fredoka One','Nunito',sans-serif;font-weight:400;margin:0}
.oculto{display:none!important}
/* Login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
#login form{background:#fff;border-radius:24px;padding:28px 22px;width:100%;max-width:360px;text-align:center;box-shadow:0 6px 24px rgba(45,67,117,.08)}
#login h1{font-size:28px;color:var(--azul)}#login p{color:var(--gris);margin:6px 0 18px}
/* Cabecera */
header{position:sticky;top:0;z-index:5;background:var(--fondo);padding:12px 16px 8px;border-bottom:1px solid var(--borde)}
.fila{display:flex;align-items:center;gap:10px}
.marca{font-family:'Fredoka One';font-size:22px;color:var(--azul);flex:1;line-height:1.1}
.marca small{display:block;font-family:'Nunito';font-size:12px;color:var(--gris);font-weight:700}
.btn{border:0;border-radius:14px;padding:11px 16px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;line-height:1.1}
.btn:disabled{opacity:.5;cursor:default}
.naranja{background:var(--naranja);color:#2b1a12}.azul{background:var(--azul);color:#fff}.claro{background:#fff;color:var(--navy);border:1.5px solid var(--borde)}
.verde{background:#25d366;color:#0b3d1f}.rojo{background:#fff;color:#b3261e;border:1.5px solid #f2c7c3}.lima{background:var(--lima);color:#3d3d00}
.ancho{width:100%}
.icono{width:42px;height:42px;padding:0;border-radius:12px}
/* Resumen */
main{max-width:860px;margin:0 auto;padding:12px 16px 100px}
.resumen{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:4px 0 14px}
.dato{background:#fff;border-radius:18px;padding:12px 14px;border:1.5px solid transparent;cursor:pointer;text-align:left}
.dato b{display:block;font-family:'Fredoka One';font-size:24px;font-weight:400;line-height:1.1}
.dato span{font-size:13px;color:var(--gris);font-weight:700}
.dato.activo{border-color:var(--azul)}
.dato.alerta b{color:#d9552f}
/* Filtros */
.filtros{display:flex;flex-wrap:wrap;gap:8px;padding:2px 0 10px}
.filtros::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:1.5px solid var(--borde);background:#fff;border-radius:999px;padding:7px 13px;font-weight:800;font-size:13px;cursor:pointer}
.chip.activo{background:var(--navy);border-color:var(--navy);color:#fff}
.buscar{width:100%;border:1.5px solid var(--borde);border-radius:14px;padding:11px 14px;background:#fff;margin-bottom:12px}
/* Tarjetas */
.lista{display:grid;gap:10px}
.pedido{background:#fff;border-radius:18px;padding:14px;cursor:pointer;border:1.5px solid transparent;transition:border-color .15s}
.pedido:hover{border-color:var(--rosa)}
.pedido .arriba{display:flex;gap:8px;align-items:flex-start}
.pedido .nombre{font-weight:800;font-size:16px;flex:1;min-width:0}
.pedido .nombre small{display:block;font-weight:700;color:var(--gris);font-size:12px}
.pedido .total{font-family:'Fredoka One';font-size:18px;white-space:nowrap}
.pedido .prod{margin:6px 0 8px;font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.etiquetas{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pill{font-size:12px;font-weight:800;border-radius:999px;padding:4px 10px;background:#f3eee6;white-space:nowrap}
.e-por-confirmar{background:#fff1cc;color:#8a5a00}.e-confirmado{background:#e3eafb;color:#2f4a96}.e-preparando{background:#f3f3c4;color:#5c5c00}
.e-enviado{background:var(--rosa);color:#8a2f5d}.e-entregado{background:#dcf3e4;color:#18663a}.e-cancelado,.e-devuelto{background:#eceef3;color:#6b7a99}
.p-si{background:#dcf3e4;color:#18663a}.p-no{background:#fde7e1;color:#a63c1c}
.atraso{background:#ff7d57;color:#2b1a12}
.siguiente{margin-top:10px;display:flex;gap:8px}
.siguiente .btn{padding:9px 12px;font-size:14px;border-radius:12px}
.vacio{text-align:center;color:var(--gris);padding:40px 10px}
.vacio .titulo{font-size:20px;color:var(--navy);margin-bottom:6px}
/* Hoja (detalle / nuevo) */
#velo{position:fixed;inset:0;background:rgba(45,67,117,.35);z-index:20}
.hoja{position:fixed;z-index:21;left:0;right:0;bottom:0;max-height:94vh;overflow:auto;background:var(--fondo);border-radius:24px 24px 0 0;padding:16px 16px 28px;
  max-width:640px;margin:0 auto;box-shadow:0 -8px 30px rgba(0,0,0,.12)}
@media(min-width:700px){.hoja{top:4vh;bottom:auto;border-radius:24px;max-height:92vh}}
.hoja .cab{display:flex;align-items:center;gap:10px;position:sticky;top:-16px;background:var(--fondo);padding:4px 0 10px;z-index:2}
.hoja h2{font-size:22px;flex:1}
.caja{background:#fff;border-radius:18px;padding:14px;margin-bottom:12px}
.caja h3{font-size:15px;margin-bottom:8px;color:var(--azul)}
label{display:block;font-size:12px;font-weight:800;color:var(--gris);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.03em}
label:first-child{margin-top:0}
input,select,textarea{width:100%;border:1.5px solid var(--borde);border-radius:12px;padding:10px 12px;background:#fff;font-size:16px}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--azul);outline-offset:1px}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pasos{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
.paso{border:1.5px solid var(--borde);background:#fff;border-radius:12px;padding:8px 2px;font-size:11px;overflow-wrap:anywhere;hyphens:auto;font-weight:800;cursor:pointer;text-align:center}
.paso .n{display:block;font-size:18px;line-height:1.2}
.paso.hecho{background:#eef2fb;border-color:#cdd8f3}
.paso.actual{background:var(--azul);border-color:var(--azul);color:#fff}
.secundarios{display:flex;gap:8px;margin-top:8px}
.secundarios .btn{flex:1;padding:8px;font-size:13px}
.interruptor{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;padding:10px 12px;border-radius:12px;background:#f8f4ee;font-weight:800}
.interruptor input{width:auto;transform:scale(1.4)}
label.interruptor{text-transform:none;letter-spacing:0;font-size:14px;color:var(--navy);cursor:pointer}
.acciones{display:grid;gap:8px}
.historial{font-size:13px;color:var(--gris);margin:0;padding-left:18px}
.historial li{margin:3px 0}
.catalogo{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.catalogo .chip{font-size:12px;padding:6px 10px}
.items{margin:8px 0 0;padding:0;list-style:none}
.items li{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px dashed var(--borde);font-size:14px}
.items li span{flex:1}.items button{border:0;background:#f3eee6;border-radius:8px;width:28px;height:28px;cursor:pointer;font-weight:800}
.tallas{display:flex;gap:6px;align-items:center;font-size:13px;font-weight:800;margin-top:4px}
.aviso{background:#fff7e0;border-radius:12px;padding:10px 12px;font-size:14px}
.nota-chica{font-size:12px;color:var(--gris);margin-top:4px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 18px;border-radius:14px;font-weight:800;z-index:40;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.cargando{opacity:.6;pointer-events:none}
.btn-borrar{margin-left:8px;border:0;background:transparent;font-size:17px;cursor:pointer;opacity:.55;padding:2px 4px;vertical-align:middle}.btn-borrar:hover{opacity:1}
.opciones-envio{display:grid;gap:6px;margin-top:10px}.opcion-envio{display:flex;gap:10px;align-items:flex-start;background:var(--fondo);border-radius:12px;padding:10px;font-weight:400}.opcion-envio small{display:block;color:var(--gris);font-size:12px}.opcion-envio input{margin-top:3px}
/* Pestañas e inventario */
.pestanas{display:flex;gap:6px;margin-top:10px}
.pestana{flex:1;border:1.5px solid var(--borde);background:#fff;border-radius:12px;padding:9px 8px;font-weight:800;cursor:pointer;font-size:14px}
.pestana.activo{background:var(--navy);border-color:var(--navy);color:#fff}
.inv-acciones{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:4px 0 14px}
.inv-acciones .btn{padding:11px 10px;font-size:14px}
.stock{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:16px}
.stock-it{background:#fff;border-radius:18px;padding:12px 14px;border:1.5px solid transparent}
.stock-it.agotado{border-color:#f2c7c3}.stock-it.pocos{border-color:#ffd59a}
.stock-it .n{font-weight:800;font-size:13px;color:var(--gris);display:flex;justify-content:space-between;gap:6px;align-items:flex-start}
.stock-it b{display:block;font-family:'Fredoka One';font-weight:400;font-size:30px;line-height:1.15}
.stock-it small{display:block;font-size:12px;font-weight:700;color:var(--gris)}
.stock-it .quitar{border:0;background:transparent;cursor:pointer;opacity:.5;font-size:13px;padding:0}
.tabla{width:100%;border-collapse:collapse;font-size:14px}
.tabla th{font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--gris);text-align:right;padding:6px 4px;font-weight:800}
.tabla th:first-child,.tabla td:first-child{text-align:left}
.tabla td{padding:7px 4px;border-top:1px dashed var(--borde);text-align:right;font-weight:700}
.tabla tr.total td{font-weight:900;border-top:1.5px solid var(--borde)}
.movs{list-style:none;margin:0;padding:0;font-size:14px}
.movs li{display:flex;gap:8px;align-items:center;padding:8px 0;border-top:1px dashed var(--borde)}
.movs li span{flex:1;min-width:0}.movs small{display:block;color:var(--gris);font-size:12px}
.cantidades{display:grid;gap:6px;margin-top:6px}
.cant{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px}
.cant span{flex:1}.cant input{width:76px;text-align:center;padding:8px}
.cant button{border:0;background:#f3eee6;border-radius:10px;width:36px;height:36px;font-weight:900;cursor:pointer;font-size:16px}
.sin-leer{display:grid;gap:6px;margin-top:6px}.sin-leer button{text-align:left;border:0;background:#fff7e0;border-radius:12px;padding:9px 11px;cursor:pointer;font-size:13px}
.t-colaboracion{background:#e8e0fb;color:#5a3aa8}.t-regalo{background:#fde3ef;color:#a0336b}
</style>
</head>
<body>

<!-- Entrar -->
<section id="login" class="oculto">
  <form id="formLogin" autocomplete="on">
    <h1>Wuuff Puppy</h1>
    <p>Panel de pedidos</p>
    <input type="text" name="usuario" value="wuuff" autocomplete="username" class="oculto" aria-hidden="true" tabindex="-1">
    <input id="clave" type="password" placeholder="Clave del panel" autocomplete="current-password" required>
    <p id="loginError" class="oculto" style="color:#b3261e;margin:10px 0 0;font-weight:800"></p>
    <button class="btn naranja ancho" style="margin-top:14px" type="submit">Entrar</button>
  </form>
</section>

<!-- Panel -->
<section id="app" class="oculto">
  <header>
    <div class="fila">
      <div class="marca">Pedidos Wuuff<small id="actualizado">Cargando…</small></div>
      <button class="btn claro icono" id="btnRecargar" title="Actualizar" aria-label="Actualizar">⟳</button>
      <button class="btn naranja" id="btnNuevo">＋ Nuevo</button>
    </div>
    <div class="pestanas" role="tablist">
      <button class="pestana activo" data-tab="pedidos" role="tab">📋 Pedidos</button>
      <button class="pestana" data-tab="inventario" role="tab">📦 Inventario</button>
    </div>
  </header>
  <main id="vistaInventario" class="oculto"></main>
  <main id="vistaPedidos">
    <div class="resumen" id="resumen"></div>
    <div class="filtros" id="filtros"></div>
    <input class="buscar" id="buscar" type="search" placeholder="Buscar por nombre, celular, producto, guía o referencia…">
    <div class="lista" id="lista"></div>
    <div style="display:flex;gap:8px;justify-content:center;margin-top:22px;flex-wrap:wrap">
      <button class="btn claro" id="btnCsv">⬇ Descargar Excel (CSV)</button>
      <button class="btn claro" id="btnSalir">Cerrar sesión</button>
    </div>
  </main>
</section>

<div id="velo" class="oculto"></div>
<section class="hoja oculto" id="hoja" role="dialog" aria-modal="true"></section>
<div id="toast" class="oculto"></div>

<script>
(function () {
  'use strict';
  const API = '/.netlify/functions/panel-pedidos';
  const WHATSAPP_TIENDA = '573176431286';
  const DIAS_ENTREGA = 3; // días hábiles prometidos para despachar

  // Productos para agregar rápido (mismos precios de la web: netlify/lib/tienda.js y assets/collar-nombre.json)
  const CATALOGO = [
    { id: 'combo', n: 'Combo completo', p: 149900, talla: true },
    { id: 'arnes-correa', n: 'Arnés + correa', p: 109900, talla: true },
    { id: 'collar-correa', n: 'Collar + correa', p: 89900, talla: true },
    { id: 'collar-correa-nombre', n: 'Collar con nombre + correa', p: 115000, talla: true },
    { id: 'combo-nombre', n: 'Combo completo con collar con nombre', p: 164900, talla: true },
    { id: 'arnes', n: 'Arnés tipo H', p: 69900, talla: true },
    { id: 'collar-nombre', n: 'Collar con nombre', p: 59900, talla: true },
    { id: 'collar', n: 'Collar', p: 44900, talla: true },
    { id: 'correa', n: 'Correa', p: 59900, talla: false },
    { id: 'placa', n: 'Placa Inteligente', p: 29900, talla: false },
    { id: 'placa-add', n: 'Placa (con otro producto)', p: 19900, talla: false },
    { id: 'letra', n: 'Letra extra', p: 5000, talla: false }
  ];
  const ESTADOS = [
    { id: 'por-confirmar', n: 'Por confirmar', i: '🕐' },
    { id: 'confirmado', n: 'Confirmado', i: '👍' },
    { id: 'preparando', n: 'Preparando', i: '✂️' },
    { id: 'enviado', n: 'Enviado', i: '🚚' },
    { id: 'entregado', n: 'Entregado', i: '🎉' },
    { id: 'cancelado', n: 'Cancelado', i: '✖' },
    { id: 'devuelto', n: 'Devuelto', i: '↩' }
  ];
  const EST = Object.fromEntries(ESTADOS.map(e => [e.id, e]));
  const ORIGENES = { web: '🌐 Web', whatsapp: '💬 WhatsApp', instagram: '📸 Instagram', facebook: '👍 Facebook', tiktok: '🎵 TikTok', marketplace: '🛒 Marketplace', stand: '⛺ Stand', consignacion: '🏪 Consignación', otro: '✳️ Otro' };
  const TIPOS = { venta: '💰 Venta', colaboracion: '🤝 Colaboración', regalo: '🎁 Regalo' };
  const PAGOS = { contraentrega: '💵 Contraentrega', wompi: '💳 Wompi', nequi: '📲 Nequi / Bre-B', transferencia: '🏦 Transferencia', efectivo: '💵 Efectivo', otro: 'Otro' };
  const FILTROS = [
    { id: 'activos', n: 'Activos', f: p => ['por-confirmar', 'confirmado', 'preparando', 'enviado'].includes(p.estado) },
    { id: 'por-confirmar', n: '🕐 Por confirmar', f: p => p.estado === 'por-confirmar' },
    { id: 'despachar', n: '📦 Por despachar', f: p => ['confirmado', 'preparando'].includes(p.estado) },
    { id: 'enviado', n: '🚚 En camino', f: p => p.estado === 'enviado' },
    { id: 'cobrar', n: '💵 Por cobrar', f: p => !p.pagado && !['cancelado', 'devuelto'].includes(p.estado) },
    { id: 'entregado', n: '🎉 Entregados', f: p => p.estado === 'entregado' },
    { id: 'cerrados', n: '✖ Cancelados', f: p => ['cancelado', 'devuelto'].includes(p.estado) },
    { id: 'todos', n: 'Todos', f: () => true }
  ];

  let token = leer('wuuffPanelToken');
  let pedidos = [];
  let filtro = 'activos';
  let texto = '';

  const $ = id => document.getElementById(id);
  function leer(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
  function guardar(k, v) { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch (e) {} }
  function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
  function pesos(c) { return '$' + Math.round((c || 0) / 100).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
  function numero(v) { return parseInt(String(v || '').replace(/[^\d]/g, ''), 10) || 0; }
  function telWa(t) { const d = String(t || '').replace(/\D/g, ''); return d.length === 10 ? '57' + d : d; }
  function primerNombre(n) { return String(n || '').trim().split(/\s+/)[0] || ''; }
  function fecha(iso) {
    const d = new Date(iso); if (isNaN(d)) return '';
    return d.toLocaleDateString('es-CO', { day: 'numeric', month: 'short' }) + ' · ' + d.toLocaleTimeString('es-CO', { hour: 'numeric', minute: '2-digit' });
  }
  function hace(iso) {
    const ms = Date.now() - new Date(iso).getTime(), h = ms / 36e5;
    if (h < 1) return 'hace un rato'; if (h < 24) return 'hace ' + Math.floor(h) + ' h';
    const d = Math.floor(h / 24); return d === 1 ? 'ayer' : 'hace ' + d + ' días';
  }
  function diasHabiles(desde) {
    let d = new Date(desde), n = 0; const hoy = new Date();
    d.setHours(0, 0, 0, 0); hoy.setHours(0, 0, 0, 0);
    while (d < hoy) { d.setDate(d.getDate() + 1); const w = d.getDay(); if (w !== 0 && w !== 6) n++; }
    return n;
  }
  function atrasado(p) { return ['confirmado', 'preparando'].includes(p.estado) && diasHabiles(p.creado) > DIAS_ENTREGA; }
  function toast(t) { const el = $('toast'); el.textContent = t; el.classList.remove('oculto'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.add('oculto'), 2600); }

  async function api(metodo, cuerpo) {
    const r = await fetch(API, {
      method: metodo,
      headers: Object.assign({ 'Content-Type': 'application/json' }, token ? { Authorization: 'Bearer ' + token } : {}),
      body: cuerpo ? JSON.stringify(cuerpo) : undefined
    });
    let j = {}; try { j = await r.json(); } catch (e) {}
    if (r.status === 401 && j.sesion === false) { salir(); throw new Error('La sesión venció. Vuelve a entrar.'); }
    if (!r.ok) throw new Error(j.error || 'Algo falló (' + r.status + ')');
    return j;
  }

  // ── Sesión ──
  function mostrarLogin() { $('app').classList.add('oculto'); $('login').classList.remove('oculto'); setTimeout(() => $('clave').focus(), 50); }
  function salir() { token = ''; guardar('wuuffPanelToken', ''); cerrarHoja(); mostrarLogin(); }
  $('formLogin').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = e.target.querySelector('button[type=submit]'); btn.disabled = true; $('loginError').classList.add('oculto');
    try {
      const j = await api('POST', { accion: 'entrar', clave: $('clave').value });
      token = j.token; guardar('wuuffPanelToken', token); $('clave').value = '';
      $('login').classList.add('oculto'); $('app').classList.remove('oculto'); cargar();
    } catch (err) { $('loginError').textContent = err.message; $('loginError').classList.remove('oculto'); }
    btn.disabled = false;
  });
  $('btnSalir').onclick = salir;

  // ── Cargar y pintar ──
  async function cargar() {
    $('actualizado').textContent = 'Cargando…';
    try {
      const j = await api('GET');
      pedidos = j.pedidos || [];
      $('actualizado').textContent = 'Actualizado ' + new Date().toLocaleTimeString('es-CO', { hour: 'numeric', minute: '2-digit' });
      pintar();
    } catch (err) { $('actualizado').textContent = err.message; }
  }
  $('btnRecargar').onclick = cargar;
  document.addEventListener('visibilitychange', () => { if (!document.hidden && token && $('hoja').classList.contains('oculto')) cargar(); });

  function pintar() {
    // Resumen
    const ahora = new Date(), mes = ahora.getFullYear() + '-' + ahora.getMonth();
    const vivos = pedidos.filter(p => !['cancelado', 'devuelto'].includes(p.estado));
    const delMes = vivos.filter(p => { const d = new Date(p.creado); return d.getFullYear() + '-' + d.getMonth() === mes && (p.tipo || 'venta') === 'venta'; });
    const porCobrar = vivos.filter(p => !p.pagado);
    const atrasados = pedidos.filter(atrasado).length;
    const despachar = pedidos.filter(p => ['confirmado', 'preparando'].includes(p.estado)).length;
    const datos = [
      { f: 'por-confirmar', v: pedidos.filter(p => p.estado === 'por-confirmar').length, t: '🕐 Por confirmar' },
      { f: 'despachar', v: despachar, t: atrasados ? '📦 Por despachar · ' + atrasados + ' atrasado' + (atrasados > 1 ? 's' : '') : '📦 Por despachar', alerta: atrasados > 0 },
      { f: 'enviado', v: pedidos.filter(p => p.estado === 'enviado').length, t: '🚚 En camino' },
      { f: 'cobrar', v: pesos(porCobrar.reduce((s, p) => s + (p.totalCents || 0), 0)), t: '💵 Por cobrar (' + porCobrar.length + ')' },
      { f: 'todos', v: pesos(delMes.reduce((s, p) => s + (p.totalCents || 0), 0)), t: '✨ Vendido este mes (' + delMes.length + ')' }
    ];
    $('resumen').innerHTML = datos.map(d => `<button class="dato${filtro === d.f ? ' activo' : ''}${d.alerta ? ' alerta' : ''}" data-f="${d.f}"><b>${esc(d.v)}</b><span>${esc(d.t)}</span></button>`).join('');
    $('resumen').querySelectorAll('.dato').forEach(b => b.onclick = () => { filtro = b.dataset.f; pintar(); });
    // Filtros
    $('filtros').innerHTML = FILTROS.map(f => `<button class="chip${filtro === f.id ? ' activo' : ''}" data-f="${f.id}">${esc(f.n)} <span style="opacity:.7">${pedidos.filter(f.f).length}</span></button>`).join('');
    $('filtros').querySelectorAll('.chip').forEach(b => b.onclick = () => { filtro = b.dataset.f; pintar(); });
    // Lista
    const ff = (FILTROS.find(f => f.id === filtro) || FILTROS[0]).f;
    const q = texto.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
    const lista = pedidos.filter(ff).filter(p => !q || [p.id, p.cliente && p.cliente.nombre, p.cliente && p.cliente.telefono, p.mascota, p.productos, p.notas, p.guia && p.guia.numero, p.cliente && p.cliente.direccion]
      .join(' ').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').includes(q));
    // Lo urgente primero: atrasados, por confirmar, por despachar; luego el resto por fecha
    const peso = p => atrasado(p) ? 0 : ({ 'por-confirmar': 1, confirmado: 2, preparando: 2, enviado: 3 }[p.estado] || 4);
    lista.sort((a, b) => peso(a) - peso(b) || (a.creado < b.creado ? 1 : -1));
    $('lista').innerHTML = lista.length ? lista.map(tarjeta).join('') :
      (pedidos.length ? '<div class="vacio"><div class="titulo">Nada por aquí</div>No hay pedidos en este filtro.</div>'
        : '<div class="vacio"><div class="titulo">Aún no hay pedidos 🐾</div>Los de la web llegan solos. Los de WhatsApp, Instagram o el stand agrégalos con <b>＋ Nuevo</b>.</div>');
    $('lista').querySelectorAll('.pedido').forEach(el => el.onclick = e => {
      const acc = e.target.closest('[data-accion]');
      if (acc) { e.stopPropagation(); if (acc.dataset.accion === 'avanzar') avanzar(el.dataset.id); if (acc.dataset.accion === 'borrar') borrarPedido(el.dataset.id); if (acc.dataset.accion === 'abrir') abrirDetalle(el.dataset.id); if (acc.dataset.accion === 'etiqueta') abrirEtiqueta(el.dataset.id); return; }
      abrirDetalle(el.dataset.id);
    });
  }

  function siguienteEstado(p) {
    return { 'por-confirmar': 'confirmado', confirmado: 'preparando', preparando: 'enviado', enviado: 'entregado' }[p.estado];
  }

  // ── Etiqueta para el paquete (imagen 15 × 10 cm para imprimir y pegar) ──
  const DEPTOS = ['Amazonas', 'Antioquia', 'Arauca', 'Atlántico', 'Bolívar', 'Boyacá', 'Caldas', 'Caquetá', 'Casanare', 'Cauca', 'Cesar', 'Chocó', 'Córdoba',
    'Cundinamarca', 'Guainía', 'Guaviare', 'Huila', 'La Guajira', 'Magdalena', 'Meta', 'Nariño', 'Norte de Santander', 'Putumayo', 'Quindío', 'Risaralda',
    'San Andrés', 'Santander', 'Sucre', 'Tolima', 'Valle del Cauca', 'Vaupés', 'Vichada'];
  const sinTilde = t => String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  // "SOACHA CUNDINAMARCA" / "Madrid, Cundinamarca" / "Bogotá" → { ciudad, depto }
  function partirCiudad(txt) {
    let t = String(txt || '').trim();
    if (!t) return { ciudad: '', depto: '' };
    if (/bogot/i.test(t)) return { ciudad: 'Bogotá', depto: 'D.C.' };
    if (t.includes(',')) { const [a, ...b] = t.split(','); return { ciudad: a.trim(), depto: b.join(',').trim() }; }
    const d = DEPTOS.slice().sort((a, b) => b.length - a.length).find(x => sinTilde(t).endsWith(' ' + sinTilde(x)));
    if (d) return { ciudad: t.slice(0, t.length - d.length).trim(), depto: d };
    return { ciudad: t, depto: '' };
  }
  function telBonito(t) { const d = String(t || '').replace(/\D/g, '').replace(/^57(?=\d{10}$)/, ''); return d.length === 10 ? d.replace(/(\d{3})(\d{3})(\d{4})/, '$1 $2 $3') : String(t || ''); }
  function contenidoCorto(p) {
    return String(p.productos || '').replace(/\s*\|\s*Perfil NFC:.*$/, '').replace(/\s*\[[^\]]*\]/g, '').replace(/\s+/g, ' ').trim().slice(0, 110);
  }
  const logoEtiqueta = new Image(); logoEtiqueta.src = '/images/wuuff-puppy.png';

        <label for="etqCobro">Cobro al entregar</label>
        <select id="etqCobro"><option value="no"${p.pagado ? ' selected' : ''}>Sin cobro · no recaudo</option><option value="si"${p.pagado ? '' : ' selected'}>Cobrar ${pesos(p.totalCents)} al entregar</option></select>
        <label for="etqSello">Sello de arriba (opcional)</label><input id="etqSello" placeholder="Ej.: PREMIO · FINALISTA" value="${p.codigo && p.codigo.tipo === 'concurso' ? 'PREMIO · FINALISTA' : ''}">
        <div class="catalogo" style="margin-top:6px">${sugerencias.map(s => `<button type="button" class="chip" data-sello="${esc(s)}">${esc(s)}</button>`).join('')}<button type="button" class="chip" data-sello="">Sin sello</button></div>
      </div>`);
    const h = $('hoja'), cv = $('etqCanvas');
    const datos = () => ({ nombre: $('etqNombre').value.trim(), tel: $('etqTel').value.trim(), dir: $('etqDir').value.trim(), ciudad: $('etqCiudad').value.trim(),

    const pintarEtq = () => dibujarEtiqueta(cv.getContext('2d'), datos());

    $('etqDescargar').onclick = () => cv.toBlob(b => { const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = archivo(); document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); });
    $('etqImprimir').onclick = () => {

  function dibujarEtiqueta(ctx, d) {
    const W = 1800, H = 1200, M = 68, AZUL = '#4964af', NAVY = '#2d4375', ROSA = '#d3889f', NARANJA = '#ff7d57', LIMA = '#d5d50c', FONDO = '#fdeee8';
    const F = (peso, t) => peso + ' ' + t + "px Nunito, 'Arial Rounded MT Bold', Arial, sans-serif";
    function redondo(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
    // texto que se achica hasta caber en el ancho
    function ajustar(t, peso, tam, ancho, min) { let s = tam; ctx.font = F(peso, s); while (s > (min || 20) && ctx.measureText(t).width > ancho) { s -= 2; ctx.font = F(peso, s); } return s; }
    // texto en varias líneas (máximo "max")
    function lineas(t, ancho, max) {
      const pal = String(t).split(/\s+/), out = []; let l = '';
      pal.forEach(w => { const p = l ? l + ' ' + w : w; if (ctx.measureText(p).width > ancho && l) { out.push(l); l = w; } else l = p; });
      if (l) out.push(l);
      if (out.length > max) { out.length = max; out[max - 1] = out[max - 1].replace(/\s*\S*$/, '') + '…'; }
      return out;
    }
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#fff'; redondo(0, 0, W, H, 40); ctx.fill();
    // cabecera: logo y sello
    if (logoEtiqueta.complete && logoEtiqueta.naturalWidth) { const lh = 150, lw = lh * logoEtiqueta.naturalWidth / logoEtiqueta.naturalHeight; ctx.drawImage(logoEtiqueta, M - 10, 14, lw, lh); }
    if (d.sello) {
      const s = ajustar(d.sello.toUpperCase(), 800, 40, 700, 24), tw = ctx.measureText(d.sello.toUpperCase()).width, pw = tw + 72, ph = 80;
      ctx.fillStyle = ROSA; redondo(W - M + 16 - pw, 56, pw, ph, ph / 2); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.textBaseline = 'middle'; ctx.textAlign = 'center'; ctx.fillText(d.sello.toUpperCase(), W - M + 16 - pw / 2, 56 + ph / 2 + 2);
    }
    // cuerpo con borde azul
    const top = 184;
    ctx.fillStyle = FONDO; redondo(14, top, W - 28, H - top - 14, 36); ctx.fill();
    ctx.strokeStyle = AZUL; ctx.lineWidth = 7; redondo(14, top, W - 28, H - top - 14, 36); ctx.stroke();
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    let y = top + 82;
    ctx.fillStyle = ROSA; ctx.font = F(800, 34); ctx.fillText('PARA', M, y);
    y += 92; ajustar(d.nombre || 'Nombre', 800, 74, W - 2 * M, 40); ctx.fillStyle = NAVY; ctx.fillText(d.nombre || 'Nombre', M, y);
    y += 102; ajustar('Tel: ' + d.tel, 800, 66, W - 2 * M, 36); ctx.fillStyle = NARANJA; ctx.fillText('Tel: ' + d.tel, M, y);
    ctx.font = F(600, 54); ctx.fillStyle = NAVY;
    const dl = lineas(d.dir || '', W - 2 * M, 2); dl.forEach((l, i) => { y += i ? 64 : 92; ctx.fillText(l, M, y); });
    // ciudad y departamento
    const by = y + 48, bh = 170;
    ctx.fillStyle = AZUL; redondo(M, by, W - 2 * M, bh, 32); ctx.fill();
    ctx.textBaseline = 'middle';
    let dw = 0;
    if (d.depto) { ctx.font = F(800, 52); dw = ctx.measureText(d.depto.toUpperCase()).width; ctx.fillStyle = LIMA; ctx.textAlign = 'right'; ctx.fillText(d.depto.toUpperCase(), W - M - 44, by + bh / 2 + 4); }
    ctx.textAlign = 'left'; ajustar((d.ciudad || '').toUpperCase(), 800, 108, W - 2 * M - 88 - (dw ? dw + 50 : 0), 40);
    ctx.fillStyle = '#fff'; ctx.fillText((d.ciudad || '').toUpperCase(), M + 44, by + bh / 2 + 6);
    // separador y pie
    const py = Math.max(by + bh + 70, 930);
    ctx.strokeStyle = '#9fb0e6'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(M, py); ctx.lineTo(W - M, py); ctx.stroke();
    ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
    ctx.fillStyle = ROSA; ctx.font = F(800, 30); ctx.fillText('CONTENIDO', M, py + 60); ctx.fillText('DE', 1190, py + 60);
    // contenido en una sola línea (se achica; si aún no cabe, se corta con …)
    ctx.fillStyle = NAVY; ajustar(d.cont || '', 600, 42, 1060, 30);
    ctx.fillText(lineas(d.cont || '', 1060, 1)[0] || '', M, py + 118);
    // cobro
    const cy = H - 114, txt = d.cobrar ? 'COBRAR ' + pesos(d.cobrar) + ' AL ENTREGAR' : 'SIN COBRO · NO RECAUDO';
    ctx.font = F(800, 32); const cw = Math.max(640, ctx.measureText(txt).width + 80);
    ctx.fillStyle = d.cobrar ? NARANJA : LIMA; redondo(M, cy, cw, 62, 31); ctx.fill();
    ctx.fillStyle = d.cobrar ? '#fff' : NAVY; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(txt, M + cw / 2, cy + 33);
    // remitente
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = NAVY; ctx.font = F(800, 38); ctx.fillText('Wuuff Puppy · Angie Monroy', 1190, py + 118);
    ctx.font = F(600, 36); ctx.fillText('WhatsApp +57 317 643 1286', 1190, py + 166); ctx.fillText('@wuuffpuppy · wuuffpuppy.co', 1190, py + 212);
  }

  // Borrar un pedido (por ejemplo, los de prueba). Pide confirmación; si fue una venta que no se dio, mejor "Cancelado".
  async function borrarPedido(id) {
    const p = pedidos.find(x => x.id === id); if (!p) return;
    const quien = (p.cliente && p.cliente.nombre) || 'sin nombre';
    if (!confirm('¿Borrar el pedido de ' + quien + ' (' + pesos(p.totalCents) + ')?\n\nNo se puede deshacer. Si es una venta que no se dio, mejor márcalo como Cancelado.')) return;
    try { await api('POST', { accion: 'borrar', id: id }); pedidos = pedidos.filter(x => x.id !== id); cerrarHoja(); pintar(); toast('Pedido borrado'); } catch (err) { toast(err.message); }
  }
  function tarjeta(p) {
    const e = EST[p.estado] || EST.confirmado, sig = siguienteEstado(p), c = p.cliente || {};
    return `<article class="pedido" data-id="${esc(p.id)}">
      <div class="arriba">
        <div class="nombre">${esc(c.nombre || 'Sin nombre')}<small>${esc(ORIGENES[p.origen] || p.origen)} · ${esc(hace(p.creado))}${c.ciudad ? ' · ' + esc(c.ciudad) : ''}</small></div>
        <div class="total">${pesos(p.totalCents)}<button type="button" class="btn-borrar" data-accion="etiqueta" aria-label="Etiqueta para el paquete" title="Etiqueta para el paquete">🏷️</button><button type="button" class="btn-borrar" data-accion="borrar" aria-label="Borrar este pedido" title="Borrar pedido">🗑</button></div>
      </div>
      <div class="prod">${esc(p.productos || '—')}</div>
      <div class="etiquetas">
        <span class="pill e-${esc(p.estado)}">${e.i} ${esc(e.n)}</span>
        <span class="pill ${p.pagado ? 'p-si' : 'p-no'}">${p.pagado ? '✓ Pagado' : (p.pago === 'contraentrega' ? '💵 Cobrar al entregar' : '✗ Sin pagar')}</span>
        ${atrasado(p) ? `<span class="pill atraso">⚠️ ${diasHabiles(p.creado)} días hábiles</span>` : ''}
        ${p.guia && p.guia.numero ? `<span class="pill">Guía ${esc(p.guia.numero)}</span>` : ''}

      </div>
      ${sig ? `<div class="siguiente">
        ${c.telefono ? `<a class="btn verde" data-accion="wa" href="${waUrl(p)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">WhatsApp</a>` : ''}
        <button class="btn claro" data-accion="avanzar" style="flex:1">${EST[sig].i} Marcar ${esc(EST[sig].n.toLowerCase())}</button>
      </div>` : `<div class="siguiente"><button class="btn claro" data-accion="abrir" style="flex:1">↩ Cambiar estado o editar</button></div>`}
    </article>`;
  }

  function mensajeWa(p) {
    const n = primerNombre(p.cliente && p.cliente.nombre), m = p.mascota ? p.mascota : 'tu perrito';
    if (p.estado === 'por-confirmar') return `¡Hola ${n}! 🐾 Te escribo de Wuuff Puppy para confirmar tu pedido:\n${p.productos}\n\nTotal${p.pago === 'contraentrega' ? ' a pagar al recibir' : ''}: ${pesos(p.totalCents)}\nDirección: ${(p.cliente && p.cliente.direccion) || ''}\n\n¿Me confirmas que todo está bien y que habrá alguien para recibir? 💛`;
    if (p.estado === 'enviado') return `¡Hola ${n}! Tu pedido Wuuff ya va en camino 🚚${p.guia && p.guia.numero ? `\nGuía ${p.guia.transportadora || ''} ${p.guia.numero}` : ''}${p.guia && p.guia.url ? `\nRastreo: ${p.guia.url}` : ''}${p.pago === 'contraentrega' && !p.pagado ? `\nRecuerda tener listos ${pesos(p.totalCents)} para pagar al recibir.` : ''}`;
    if (p.estado === 'entregado') return `¡Hola ${n}! ¿Cómo le quedó a ${m}? 🐶 Nos encantaría ver una foto con su Wuuff. Si nos dejas una reseña nos ayudas muchísimo 💛`;
    if (p.estado === 'preparando') return `¡Hola ${n}! Ya estamos preparando el pedido de ${m} ✂️🐾 Te aviso apenas salga.`;
    return `¡Hola ${n}! Te escribo de Wuuff Puppy por tu pedido 🐾`;
  }
  // Mensaje al cliente con la guía (y lo que debe pagar si es contraentrega)
  function waRastreo(p) {
    const g = p.guia || {}, n = primerNombre(p.cliente && p.cliente.nombre);
    const t = `¡Hola${n ? ' ' + n : ''}! 🐾 Tu pedido de Wuuff Puppy ya va en camino con ${g.transportadora || 'la transportadora'}.\nNúmero de guía: ${g.numero}` +
      (g.url ? `\nRastréalo aquí: ${g.url}` : '') + (!p.pagado ? `\nRecuerda tener listos ${pesos(p.totalCents)} para pagar al recibir 💵` : '');
    return 'https://wa.me/' + telWa(p.cliente && p.cliente.telefono) + '?text=' + encodeURIComponent(t);
  }
  function waUrl(p) { return 'https://wa.me/' + telWa(p.cliente && p.cliente.telefono) + '?text=' + encodeURIComponent(mensajeWa(p)); }

  async function cambiar(id, cambios, msg) {
    const j = await api('POST', { accion: 'actualizar', id, cambios });
    const i = pedidos.findIndex(p => p.id === id); if (i > -1) pedidos[i] = j.pedido;
    pintar(); if (msg) toast(msg);
    if (pestana === 'inventario') cargarInventario();
    return j.pedido;
  }
  async function avanzar(id) {
    const p = pedidos.find(x => x.id === id), sig = p && siguienteEstado(p);
    if (!sig) return;
    if (sig === 'enviado' && !(p.guia && p.guia.numero)) { abrirDetalle(id, 'enviado'); return; }
    try { await cambiar(id, { estado: sig }, EST[sig].i + ' ' + EST[sig].n); } catch (err) { toast(err.message); }
  }

  // ── Hoja: detalle ──
  function abrirHoja(html) {

    document.body.style.overflow = 'hidden'; $('hoja').scrollTop = 0;
  }
  function cerrarHoja() { $('hoja').classList.add('oculto'); $('velo').classList.add('oculto'); document.body.style.overflow = ''; }
  $('velo').onclick = cerrarHoja;
  document.addEventListener('keydown', e => { if (e.key === 'Escape') cerrarHoja(); });

  function opciones(obj, sel) { return Object.entries(obj).map(([k, v]) => `<option value="${k}"${k === sel ? ' selected' : ''}>${esc(v)}</option>`).join(''); }

  function abrirDetalle(id, enfocarGuia) {
    const p = pedidos.find(x => x.id === id); if (!p) return;
    const c = p.cliente || {}, g = p.guia || {};
    const flujo = ESTADOS.slice(0, 5), idx = flujo.findIndex(e => e.id === p.estado);
    abrirHoja(`
      <div class="cab"><h2>${esc(c.nombre || 'Pedido')}</h2><button class="btn claro icono" data-cerrar aria-label="Cerrar">✕</button></div>
      <p class="nota-chica" style="margin:-4px 0 12px">${esc(p.id)} · ${esc(fecha(p.creado))} · ${esc(ORIGENES[p.origen] || '')}</p>

      <div class="caja">
        <h3>Estado</h3>
        <p class="nota-chica" style="margin:-4px 0 8px">Toca el estado al que quieres pasarlo (también puedes devolverlo a uno anterior).</p>
        <div class="pasos">${flujo.map((e, i) => `<button class="paso${e.id === p.estado ? ' actual' : (idx > -1 && i < idx ? ' hecho' : '')}" data-estado="${e.id}"><span class="n">${e.i}</span>${esc(e.n)}</button>`).join('')}</div>
        <div class="secundarios">
          <button class="btn ${p.estado === 'cancelado' ? 'azul' : 'claro'}" data-estado="cancelado">✖ Cancelado</button>
          <button class="btn ${p.estado === 'devuelto' ? 'azul' : 'claro'}" data-estado="devuelto">↩ Devuelto</button>
        </div>
        <label class="interruptor">${p.pago === 'contraentrega' ? '💵 Ya me consignaron / recibí el dinero' : '💰 Pagado'} <input type="checkbox" id="dPagado"${p.pagado ? ' checked' : ''}></label>
        ${atrasado(p) ? `<p class="aviso" style="margin-top:10px">⚠️ Lleva ${diasHabiles(p.creado)} días hábiles sin despachar (prometes ${DIAS_ENTREGA}).</p>` : ''}
      </div>

      <div class="acciones" style="margin-bottom:12px">
        ${c.telefono ? `<a class="btn verde" href="${waUrl(p)}" target="_blank" rel="noopener">💬 Escribirle por WhatsApp</a>` : ''}
        <button class="btn claro" type="button" id="btnEtiqueta">🏷️ Etiqueta para el paquete</button>
        ${!g.numero && /bogot|soacha/i.test(c.ciudad || '') ? `<button class="btn azul" type="button" id="btnEnvia">📦 Crear guía con Envia</button>` : ''}
        ${g.numero && c.telefono ? `<a class="btn verde" href="${esc(waRastreo(p))}" target="_blank" rel="noopener">📲 Enviarle la guía por WhatsApp</a>` : ''}
        ${g.url ? `<a class="btn claro" href="${esc(g.url)}" target="_blank" rel="noopener">🔎 Rastrear envío</a>` : ''}
        ${g.pdf ? `<a class="btn claro" href="${esc(g.pdf)}" target="_blank" rel="noopener">🖨 PDF de la guía</a>` : ''}
      </div>

      <div class="caja oculto" id="cajaEnvia">
        <h3>📦 Guía con Envia (Coordinadora)</h3>
        <p class="aviso">${p.pagado ? '✅ Ya está pagado: la guía va <b>sin recaudo</b>.' : '💵 La transportadora le cobra <b>' + pesos(p.totalCents) + '</b> al entregar.'} Créala después de confirmar por WhatsApp la dirección y que haya alguien para recibir.</p>
        <label for="eNombre">Quien recibe</label><input id="eNombre" value="${esc(c.nombre)}">
        <label for="eTel">Celular</label><input id="eTel" inputmode="tel" value="${esc(c.telefono)}">
        <label for="eDir">Dirección</label><input id="eDir" value="${esc(c.direccion)}">
        <div class="dos">
          <div><label for="eBarrio">Barrio</label><input id="eBarrio"></div>
          <div><label for="eCp">Código postal</label><input id="eCp" inputmode="numeric" value="110111"></div>
        </div>
        <label for="eRef">Indicaciones (torre, apto, portería…)</label><input id="eRef">
        <div id="eOpciones" class="opciones-envio"></div>
        <button class="btn claro ancho" type="button" id="btnCotizar" style="margin-top:10px">Ver precios de envío</button>
        <button class="btn azul ancho oculto" type="button" id="btnCrearGuia" style="margin-top:8px">Crear guía</button>
      </div>

      <form id="formDetalle">
        <div class="caja">
          <h3>Pedido</h3>
          <label for="dProductos">Productos (talla, nombre del collar, colores…)</label>
          <textarea id="dProductos" rows="3">${esc(p.productos)}</textarea>
          <div class="dos">
            <div><label for="dTotal">Total</label><input id="dTotal" inputmode="numeric" value="${Math.round((p.totalCents || 0) / 100)}"></div>
            <div><label for="dEnvio">Me costó el envío</label><input id="dEnvio" inputmode="numeric" value="${p.costoEnvioCents ? Math.round(p.costoEnvioCents / 100) : ''}" placeholder="0"></div>
          </div>
          <div class="dos">
            <div><label for="dOrigen">Llegó por</label><select id="dOrigen">${opciones(ORIGENES, p.origen)}</select></div>
            <div><label for="dPago">Forma de pago</label><select id="dPago">${opciones(PAGOS, p.pago)}</select></div>
          </div>
          <label for="dTipo">Tipo (para el inventario)</label><select id="dTipo">${opciones(TIPOS, p.tipo || 'venta')}</select>
          ${p.codigo ? `<p class="aviso" style="margin-top:10px">🏷️ Código ${esc(p.codigo.codigo)}${p.codigo.participante ? ' · ' + esc(p.codigo.participante) : ''}${p.descuentoCents ? ' · descuento ' + pesos(p.descuentoCents) : ''}${p.comisionCents ? '<br>💸 Comisión del creador: <b>' + pesos(p.comisionCents) + '</b> (pagar solo si se entrega)' : ''}</p>` : ''}
        </div>

        <div class="caja">
          <h3>Cliente</h3>
          <label for="dNombre">Nombre</label><input id="dNombre" value="${esc(c.nombre)}">
          <div class="dos">
            <div><label for="dTel">Celular</label><input id="dTel" inputmode="tel" value="${esc(c.telefono)}"></div>
            <div><label for="dMascota">Mascota</label><input id="dMascota" value="${esc(p.mascota)}"></div>
          </div>
          <label for="dDir">Dirección</label><input id="dDir" value="${esc(c.direccion)}">
          <div class="dos">
            <div><label for="dCiudad">Ciudad</label><input id="dCiudad" value="${esc(c.ciudad)}"></div>
            <div><label for="dCorreo">Correo</label><input id="dCorreo" type="email" value="${esc(c.correo)}"></div>
          </div>
        </div>

        <div class="caja" id="cajaGuia">
          <h3>Envío</h3>
          <div class="dos">
            <div><label for="dTransp">Transportadora</label><input id="dTransp" list="transportadoras" value="${esc(g.transportadora)}" placeholder="Coordinadora, Interrapidísimo, Picap…"></div>
            <div><label for="dGuia">Número de guía</label><input id="dGuia" value="${esc(g.numero)}"></div>
          </div>
          <label for="dUrl">Enlace de rastreo (opcional)</label><input id="dUrl" type="url" value="${esc(g.url)}" placeholder="https://…">
          <datalist id="transportadoras"><option>Coordinadora</option><option>Interrapidísimo</option><option>Servientrega</option><option>Envía</option><option>Picap</option><option>Mensajero propio</option><option>Entrega en persona</option></datalist>
        </div>

        <div class="caja">
          <h3>Notas</h3>
          <textarea id="dNotas" rows="3" placeholder="Ej.: entregar después de las 5 p. m., pidió letras rosadas…">${esc(p.notas)}</textarea>
          ${(p.historial || []).length ? `<label style="margin-top:12px">Historial</label><ul class="historial">${p.historial.slice().reverse().map(h => `<li>${esc(fecha(h.fecha))} — ${esc(h.texto)}</li>`).join('')}</ul>` : ''}
        </div>

        <button class="btn naranja ancho" type="submit">Guardar cambios</button>
      </form>
      <button class="btn rojo ancho" id="btnBorrar" style="margin-top:10px">Borrar pedido</button>
    `);
    const h = $('hoja');
    h.querySelector('[data-cerrar]').onclick = cerrarHoja;
    h.querySelectorAll('[data-estado]').forEach(b => b.onclick = async () => {
      const estado = b.dataset.estado;
      if (estado === 'enviado' && !$('dGuia').value.trim()) {
        $('cajaGuia').scrollIntoView({ behavior: 'smooth', block: 'center' }); $('dTransp').focus();
        toast('Escribe la transportadora y la guía, y luego guarda'); h.dataset.pendiente = 'enviado'; return;
      }
      try { await guardarDetalle(p.id, { estado }); } catch (err) { toast(err.message); }
    });
    $('dPagado').onchange = async e => { try { await cambiar(p.id, { pagado: e.target.checked }, e.target.checked ? '💰 Pagado' : 'Marcado sin pagar'); } catch (err) { toast(err.message); e.target.checked = !e.target.checked; } };
    $('formDetalle').onsubmit = async e => {
      e.preventDefault();
      const extra = h.dataset.pendiente && $('dGuia').value.trim() ? { estado: h.dataset.pendiente } : {};
      try { await guardarDetalle(p.id, extra); cerrarHoja(); } catch (err) { toast(err.message); }
    };
    $('btnBorrar').onclick = () => borrarPedido(p.id);
    $('btnEtiqueta').onclick = () => abrirEtiqueta(p.id);
    // Guía de Envia desde el panel: ver precios → elegir → crear (queda Enviado con su guía)
    const datosEnvio = () => ({ nombre: $('eNombre').value, telefono: $('eTel').value, direccion: $('eDir').value, barrio: $('eBarrio').value, cp: $('eCp').value, referencia: $('eRef').value, ciudad: c.ciudad });
    if ($('btnEnvia')) $('btnEnvia').onclick = () => { $('cajaEnvia').classList.remove('oculto'); $('cajaEnvia').scrollIntoView({ behavior: 'smooth', block: 'start' }); };
    if ($('btnCotizar')) $('btnCotizar').onclick = async () => {
      const b = $('btnCotizar'); b.disabled = true; b.textContent = 'Consultando Envia…';
      try {
        const r = await api('POST', { accion: 'cotizar-guia', id: p.id, destino: datosEnvio() });
        const ops = r.opciones && r.opciones.length ? r.opciones : [{ opcion: 'coordinadora|ground', nombre: 'Coordinadora', precio: 0 }];
        $('eOpciones').innerHTML = ops.map((o, i) => `<label class="opcion-envio"><input type="radio" name="eOpcion" value="${esc(o.opcion)}"${i === 0 ? ' checked' : ''}><span><b>${esc(o.nombre)}</b>${o.precio ? ' · ' + pesos(o.precio * 100) : ''}${o.comision ? `<small>Incluye comisión contraentrega ${pesos(o.comision * 100)}</small>` : ''}${o.entrega ? `<small>Entrega: ${esc(o.entrega)}</small>` : ''}</span></label>`).join('');
        $('btnCrearGuia').classList.remove('oculto'); b.textContent = 'Volver a cotizar';
      } catch (err) { toast(err.message); b.textContent = 'Ver precios de envío'; }
      b.disabled = false;
    };
    if ($('btnCrearGuia')) $('btnCrearGuia').onclick = async () => {
      const op = h.querySelector('input[name=eOpcion]:checked'); if (!op) return;
      if (!confirm('¿Crear la guía en Envia? Se descuenta de tu saldo de Envia.')) return;
      const b = $('btnCrearGuia'); b.disabled = true; b.textContent = 'Creando guía…';
      try {
        const r = await api('POST', { accion: 'crear-guia', id: p.id, opcion: op.value, destino: datosEnvio() });
        pedidos = pedidos.map(x => x.id === p.id ? r.pedido : x); pintar(); abrirDetalle(p.id); toast('✅ Guía ' + r.pedido.guia.numero + ' creada');
      } catch (err) { toast(err.message); b.disabled = false; b.textContent = 'Crear guía'; }
    };
    if (enfocarGuia) { h.dataset.pendiente = enfocarGuia; setTimeout(() => { $('cajaGuia').scrollIntoView({ block: 'center' }); $('dTransp').focus(); toast('Escribe la guía y guarda para marcarlo enviado'); }, 100); }
  }

  async function guardarDetalle(id, extra) {
    const cambios = Object.assign({
      productos: $('dProductos').value, total: $('dTotal').value, costoEnvio: $('dEnvio').value,
      origen: $('dOrigen').value, pago: $('dPago').value, tipo: $('dTipo').value, mascota: $('dMascota').value, notas: $('dNotas').value,
      cliente: { nombre: $('dNombre').value, telefono: $('dTel').value, direccion: $('dDir').value, ciudad: $('dCiudad').value, correo: $('dCorreo').value },
      guia: { transportadora: $('dTransp').value, numero: $('dGuia').value, url: $('dUrl').value }
    }, extra || {});
    const p = await cambiar(id, cambios, extra && extra.estado ? EST[extra.estado].i + ' ' + EST[extra.estado].n : 'Guardado ✓');
    if (extra && extra.estado && !$('hoja').classList.contains('oculto')) abrirDetalle(p.id);
  }

  // ── Hoja: nuevo pedido ──
  $('btnNuevo').onclick = () => {
    if (pestana === 'inventario') { abrirMovimiento('entrada'); return; }
    let items = [], talla = 'S', totalManual = false;
    const hoy = new Date(Date.now() - 5 * 36e5).toISOString().slice(0, 10);
    abrirHoja(`
      <div class="cab"><h2>Nuevo pedido</h2><button class="btn claro icono" data-cerrar aria-label="Cerrar">✕</button></div>
      <form id="formNuevo">
        <div class="caja">
          <h3>¿Qué lleva?</h3>
          <div class="tallas">Talla: <button type="button" class="chip activo" data-talla="S">S</button><button type="button" class="chip" data-talla="M">M</button></div>
          <div class="catalogo">${CATALOGO.map(x => `<button type="button" class="chip" data-p="${x.id}">＋ ${esc(x.n)} · ${pesos(x.p * 100)}</button>`).join('')}</div>
          <ul class="items" id="nItems"></ul>
          <label for="nDetalle">Detalle (nombre del collar, colores de letras, forma de la placa…)</label>
          <input id="nDetalle" placeholder="Ej.: LUNA en rosado · placa huella morada">
          <div class="dos">
            <div><label for="nTotal">Total a cobrar</label><input id="nTotal" inputmode="numeric" placeholder="0"></div>
            <div><label for="nEnvio">Me cuesta el envío</label><input id="nEnvio" inputmode="numeric" placeholder="0"></div>
          </div>
          <p class="nota-chica">El total se suma solo; cámbialo si diste descuento o cobras envío.</p>
        </div>

        <div class="caja">
          <h3>Cliente</h3>
          <label for="nNombre">Nombre</label><input id="nNombre" autocomplete="off">
          <div class="dos">
            <div><label for="nTel">Celular</label><input id="nTel" inputmode="tel" autocomplete="off"></div>
            <div><label for="nMascota">Mascota</label><input id="nMascota" autocomplete="off"></div>
          </div>
          <label for="nDir">Dirección</label><input id="nDir" autocomplete="off">
          <label for="nCiudad">Ciudad</label><input id="nCiudad" value="Bogotá" autocomplete="off">
        </div>

        <div class="caja">
          <h3>Venta</h3>
          <div class="dos">
            <div><label for="nOrigen">Llegó por</label><select id="nOrigen">${opciones(ORIGENES, 'whatsapp')}</select></div>
            <div><label for="nPago">Forma de pago</label><select id="nPago">${opciones(PAGOS, 'nequi')}</select></div>
          </div>
          <label for="nTipo">Tipo</label><select id="nTipo">${opciones(TIPOS, 'venta')}</select>
          <p class="nota-chica">Colaboración o regalo: el producto sale del inventario pero no cuenta como venta.</p>
          <div class="dos">
            <div><label for="nEstado">Estado</label><select id="nEstado">${ESTADOS.slice(0, 5).map(e => `<option value="${e.id}"${e.id === 'confirmado' ? ' selected' : ''}>${e.i} ${esc(e.n)}</option>`).join('')}</select></div>
            <div><label for="nFecha">Fecha</label><input id="nFecha" type="date" value="${hoy}"></div>
          </div>
          <label class="interruptor">💰 Ya está pagado <input type="checkbox" id="nPagado"></label>
          <label for="nNotas">Notas</label><textarea id="nNotas" rows="2"></textarea>
        </div>
        <button class="btn naranja ancho" type="submit">Guardar pedido</button>
      </form>`);
    const h = $('hoja');
    h.querySelector('[data-cerrar]').onclick = cerrarHoja;
    const pintarItems = () => {
      items.forEach(it => { it.txt = it.base + (it.q > 1 ? ' x' + it.q : ''); });
      $('nItems').innerHTML = items.map((it, i) => `<li><span>${esc(it.txt)}</span><b>${pesos(it.p * 100 * it.q)}</b><button type="button" data-menos="${i}" aria-label="Quitar uno">−</button><button type="button" data-mas="${i}" aria-label="Agregar uno">＋</button></li>`).join('');
      $('nItems').querySelectorAll('[data-menos]').forEach(b => b.onclick = () => { const it = items[b.dataset.menos]; it.q--; if (it.q < 1) items.splice(b.dataset.menos, 1); pintarItems(); });
      $('nItems').querySelectorAll('[data-mas]').forEach(b => b.onclick = () => { items[b.dataset.mas].q++; pintarItems(); });
      if (!totalManual) $('nTotal').value = items.reduce((s, it) => s + it.p * it.q, 0) || '';
    };
    h.querySelectorAll('[data-talla]').forEach(b => b.onclick = () => { talla = b.dataset.talla; h.querySelectorAll('[data-talla]').forEach(x => x.classList.toggle('activo', x === b)); });
    h.querySelectorAll('[data-p]').forEach(b => b.onclick = () => {
      const x = CATALOGO.find(c => c.id === b.dataset.p), base = x.n + (x.talla ? ' (Talla ' + talla + ')' : '');
      const ya = items.find(it => it.base === base);
      if (ya) ya.q++; else items.push({ base, p: x.p, q: 1 });
      pintarItems();
    });
    $('nTotal').oninput = () => { totalManual = $('nTotal').value !== ''; };
    $('nPago').onchange = () => { if (['nequi', 'transferencia', 'wompi'].includes($('nPago').value)) $('nPagado').checked = true; if ($('nPago').value === 'contraentrega') $('nPagado').checked = false; };
    $('formNuevo').onsubmit = async e => {
      e.preventDefault();
      const productos = items.map(it => it.txt).concat($('nDetalle').value.trim() ? [$('nDetalle').value.trim()] : []).join('\n');
      if (!productos && !$('nNombre').value.trim()) { toast('Agrega al menos un producto o el nombre del cliente'); return; }
      const btn = e.target.querySelector('button[type=submit]'); btn.disabled = true;
      try {
        const j = await api('POST', { accion: 'crear', pedido: {
          productos, total: $('nTotal').value, costoEnvio: $('nEnvio').value, origen: $('nOrigen').value, pago: $('nPago').value, tipo: $('nTipo').value,
          estado: $('nEstado').value, pagado: $('nPagado').checked, fecha: $('nFecha').value, mascota: $('nMascota').value, notas: $('nNotas').value,
          cliente: { nombre: $('nNombre').value, telefono: $('nTel').value, direccion: $('nDir').value, ciudad: $('nCiudad').value }
        } });
        pedidos.unshift(j.pedido); cerrarHoja(); filtro = 'activos'; pintar(); toast('Pedido guardado 🐾');
      } catch (err) { toast(err.message); btn.disabled = false; }
    };
  };

  // ── Buscar y exportar ──
  $('buscar').oninput = e => { texto = e.target.value.trim(); pintar(); };
  $('btnCsv').onclick = () => {
    const col = ['Referencia', 'Fecha', 'Cliente', 'Celular', 'Ciudad', 'Dirección', 'Mascota', 'Productos', 'Total', 'Costo envío', 'Llegó por', 'Pago', 'Pagado', 'Estado', 'Transportadora', 'Guía', 'Código', 'Comisión', 'Notas'];
    const filas = pedidos.map(p => [p.id, new Date(p.creado).toLocaleDateString('es-CO'), p.cliente && p.cliente.nombre, p.cliente && p.cliente.telefono, p.cliente && p.cliente.ciudad,
      p.cliente && p.cliente.direccion, p.mascota, p.productos, Math.round((p.totalCents || 0) / 100), Math.round((p.costoEnvioCents || 0) / 100),
      ORIGENES[p.origen] || p.origen, PAGOS[p.pago] || p.pago, p.pagado ? 'Sí' : 'No', (EST[p.estado] || {}).n, p.guia && p.guia.transportadora, p.guia && p.guia.numero,
      p.codigo && p.codigo.codigo, p.comisionCents ? Math.round(p.comisionCents / 100) : '', p.notas]);
    const csv = '﻿' + [col].concat(filas).map(f => f.map(v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"').join(';')).join('\r\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
    a.download = 'pedidos-wuuff-' + new Date().toISOString().slice(0, 10) + '.csv'; a.click();
  };

  // ── Pestañas: Pedidos / Inventario ──
  let pestana = 'pedidos', inv = null, invMes = 'este';
  document.querySelectorAll('.pestana').forEach(b => b.onclick = () => {
    pestana = b.dataset.tab;
    document.querySelectorAll('.pestana').forEach(x => x.classList.toggle('activo', x === b));
    $('vistaPedidos').classList.toggle('oculto', pestana !== 'pedidos');
    $('vistaInventario').classList.toggle('oculto', pestana !== 'inventario');
    $('btnNuevo').textContent = pestana === 'inventario' ? '＋ Llegó producto' : '＋ Nuevo';
    if (pestana === 'inventario') cargarInventario();
  });
  async function cargarInventario(accion) {
    if (!inv) $('vistaInventario').innerHTML = '<div class="vacio">Cargando inventario…</div>';
    try { inv = await api('POST', accion || { accion: 'inventario' }); pintarInventario(); return true; }
    catch (err) { toast(err.message); if (!inv) $('vistaInventario').innerHTML = '<div class="vacio">' + esc(err.message) + '</div>'; return false; }
  }
  const MOV = {
    entrada: { i: '📥', n: 'Llegó producto', t: '¿Cuánto llegó?', nota: 'Proveedor, lote… (opcional)' },
    conteo: { i: '🔢', n: 'Conteo', t: '¿Cuánto tienes ahora en bodega?', nota: 'Ej.: conteo de fin de mes' },
    colaboracion: { i: '🤝', n: 'Colaboración', t: '¿Qué le diste?', nota: '¿Con quién? Ej.: @creadora' },
    regalo: { i: '🎁', n: 'Regalo', t: '¿Qué regalaste?', nota: '¿A quién? Ej.: sorteo, cliente…' },
    danado: { i: '⚠️', n: 'Dañado o perdido', t: '¿Qué se dañó o se perdió?', nota: '¿Qué pasó?' }
  };
  function mesDe(iso) { const d = new Date(new Date(iso).getTime() - 5 * 36e5); return d.toISOString().slice(0, 7); }
  function mesTexto(m) { const [a, n] = m.split('-'); return new Date(+a, +n - 1, 15).toLocaleDateString('es-CO', { month: 'long', year: 'numeric' }); }
  function pintarInventario() {
    const v = $('vistaInventario'), it = inv.items || [];
    const hoy = mesDe(new Date().toISOString()), d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - 1);
    const pasado = mesDe(d.toISOString());
    const meses = { este: hoy, pasado, todo: '' };
    const salidas = (inv.salidas || []).filter(s => !meses[invMes] || mesDe(s.fecha) === meses[invMes]);
    const cols = [['venta', 'Vendido'], ['colaboracion', 'Colab.'], ['regalo', 'Regalos'], ['danado', 'Dañados']];
    const suma = (item, tipo) => salidas.filter(s => s.item === item && s.tipo === tipo).reduce((n, s) => n + s.cantidad, 0);
    const filas = it.map(x => ({ x, c: cols.map(([t]) => suma(x.id, t)) })).filter(f => f.c.some(Boolean));
    const nombre = id => (it.find(x => x.id === id) || {}).nombre || id;
    v.innerHTML = `
      ${inv.conConteo ? '' : '<p class="aviso" style="margin:4px 0 12px">👋 Para empezar, toca <b>🔢 Hacer conteo</b> y escribe cuánto tienes hoy de cada producto. Desde ahí, lo que se envía en los pedidos se descuenta solo.</p>'}
      <div class="inv-acciones">
        <button class="btn naranja" data-mov="entrada">📥 Llegó producto</button>
        <button class="btn claro" data-mov="conteo">🔢 Hacer conteo</button>
        <button class="btn claro" data-mov="colaboracion">🤝 Colaboración</button>
        <button class="btn claro" data-mov="regalo">🎁 Regalo</button>
        <button class="btn claro" data-mov="danado">⚠️ Dañado o perdido</button>
      </div>
      <h3 style="margin:0 0 8px">📦 Lo que tengo</h3>
      <div class="stock">${it.map(x => {
        const cls = x.disponible <= 0 ? ' agotado' : (x.disponible <= 3 ? ' pocos' : '');
        return `<div class="stock-it${cls}"><div class="n"><span>${esc(x.nombre)}</span>${x.extra ? `<button class="quitar" data-quitar-prod="${esc(x.id)}" title="Quitar del inventario" aria-label="Quitar ${esc(x.nombre)}">✕</button>` : ''}</div>
          <b>${x.bodega}</b><small>en bodega${x.porDespachar ? ` · ${x.porDespachar} por despachar` : ''}</small>
          <small style="color:${x.disponible <= 0 ? '#b3261e' : (x.disponible <= 3 ? '#a05a00' : 'var(--gris)')}">${x.disponible <= 0 ? '⛔ Agotado para vender' : (x.disponible <= 3 ? '⚠️ Quedan ' + x.disponible + ' para vender' : x.disponible + ' disponibles para vender')}</small>
          ${x.conteo ? `<small>Conteo: ${esc(fecha(x.conteo.fecha))}</small>` : ''}</div>`;
      }).join('')}</div>
      <button class="btn claro" id="btnProducto" style="margin:-6px 0 16px">＋ Agregar otro producto al inventario</button>

      <div class="caja">
        <h3>📊 Lo que salió</h3>
        <div class="filtros" style="padding-top:0">${[['este', 'Este mes'], ['pasado', 'Mes pasado'], ['todo', 'Todo']].map(([k, n]) => `<button class="chip${invMes === k ? ' activo' : ''}" data-mes="${k}">${n}</button>`).join('')}</div>
        <p class="nota-chica" style="margin:-4px 0 8px">${invMes === 'todo' ? 'Desde que empezaste a usar el panel.' : 'En ' + esc(mesTexto(meses[invMes])) + '.'} Las ventas salen de los pedidos <b>enviados o entregados</b>; colaboraciones y regalos, de los pedidos con ese tipo y de lo que anotas aquí.</p>
        ${filas.length ? `<table class="tabla"><thead><tr><th>Producto</th>${cols.map(c => `<th>${c[1]}</th>`).join('')}</tr></thead><tbody>
          ${filas.map(f => `<tr><td>${esc(f.x.nombre)}</td>${f.c.map(n => `<td>${n || '—'}</td>`).join('')}</tr>`).join('')}
          <tr class="total"><td>Total</td>${cols.map((c, i) => `<td>${filas.reduce((n, f) => n + f.c[i], 0)}</td>`).join('')}</tr></tbody></table>`
          : '<p class="nota-chica">Nada en este periodo.</p>'}
      </div>

      ${(inv.sinLeer || []).length ? `<div class="caja"><h3>🤔 Pedidos que no pude leer</h3>
        <p class="nota-chica" style="margin:-4px 0 6px">No entendí qué productos o qué talla llevan, así que no los descuento. Ábrelos y escribe el producto como en el catálogo (ej.: "Arnés tipo H (Talla S)").</p>
        <div class="sin-leer">${inv.sinLeer.map(s => `<button data-abrir="${esc(s.id)}"><b>${esc(s.cliente || 'Sin nombre')}</b> · ${esc(s.productos || '—')}</button>`).join('')}</div></div>` : ''}

      <div class="caja"><h3>🕑 Movimientos</h3>
        ${(inv.movimientos || []).length ? `<ul class="movs">${inv.movimientos.slice(0, 40).map(m => `<li><span>${MOV[m.tipo] ? MOV[m.tipo].i : ''} <b>${m.tipo === 'conteo' ? 'Conteo: ' + m.cantidad : (m.tipo === 'entrada' ? '+' : '−') + m.cantidad}</b> ${esc(nombre(m.item))}
          <small>${esc(fecha(m.fecha))}${m.nota ? ' · ' + esc(m.nota) : ''}</small></span><button class="btn-borrar" data-borrar-mov="${esc(m.id)}" aria-label="Borrar movimiento" title="Borrar">🗑</button></li>`).join('')}</ul>`
          : '<p class="nota-chica">Aún no hay movimientos.</p>'}
      </div>`;
    v.querySelectorAll('[data-mov]').forEach(b => b.onclick = () => abrirMovimiento(b.dataset.mov));
    v.querySelectorAll('[data-mes]').forEach(b => b.onclick = () => { invMes = b.dataset.mes; pintarInventario(); });
    v.querySelectorAll('[data-abrir]').forEach(b => b.onclick = () => abrirDetalle(b.dataset.abrir));
    v.querySelectorAll('[data-borrar-mov]').forEach(b => b.onclick = async () => {
      if (!confirm('¿Borrar este movimiento del inventario?')) return;
      if (await cargarInventario({ accion: 'inv-borrar', id: b.dataset.borrarMov })) toast('Movimiento borrado');
    });
    v.querySelectorAll('[data-quitar-prod]').forEach(b => b.onclick = async () => {
      if (!confirm('¿Quitar este producto del inventario?')) return;
      if (await cargarInventario({ accion: 'inv-quitar-producto', id: b.dataset.quitarProd })) toast('Producto quitado');
    });
    $('btnProducto').onclick = async () => {
      const n = prompt('Nombre del producto (ej.: Bolsas de regalo, Letras rosadas…)');
      if (n && n.trim() && await cargarInventario({ accion: 'inv-producto', nombre: n.trim() })) toast('Producto agregado');
    };
  }
  function abrirMovimiento(tipo) {
    const it = (inv && inv.items) || [], hoy = new Date(Date.now() - 5 * 36e5).toISOString().slice(0, 10);
    abrirHoja(`
      <div class="cab"><h2>${MOV[tipo].i} ${esc(MOV[tipo].n)}</h2><button class="btn claro icono" data-cerrar aria-label="Cerrar">✕</button></div>
      <form id="formMov">
        <div class="caja">
          <label for="mTipo">Qué pasó</label>
          <select id="mTipo">${Object.entries(MOV).map(([k, m]) => `<option value="${k}"${k === tipo ? ' selected' : ''}>${m.i} ${esc(m.n)}</option>`).join('')}</select>
          <h3 style="margin-top:14px" id="mTitulo">${esc(MOV[tipo].t)}</h3>
          <p class="nota-chica" id="mAyuda" style="margin:-4px 0 4px">${tipo === 'conteo' ? 'Escribe solo los que contaste (deja vacío lo que no contaste).' : 'Deja vacío lo que no aplica.'}</p>
          <div class="cantidades">${it.map(x => `<div class="cant"><span>${esc(x.nombre)}${tipo === 'conteo' ? '' : ` <small style="color:var(--gris)">(${x.bodega})</small>`}</span>
            <button type="button" data-menos="${esc(x.id)}" aria-label="Menos">−</button><input type="number" min="0" inputmode="numeric" data-item="${esc(x.id)}" placeholder="—" aria-label="${esc(x.nombre)}"><button type="button" data-mas="${esc(x.id)}" aria-label="Más">＋</button></div>`).join('')}</div>
        </div>
        <div class="caja">
          <div class="dos">
            <div><label for="mFecha">Fecha</label><input id="mFecha" type="date" value="${hoy}" max="${hoy}"></div>
            <div><label for="mNota">Nota</label><input id="mNota" maxlength="200" placeholder="${esc(MOV[tipo].nota)}"></div>
          </div>
        </div>
        <button class="btn naranja ancho" type="submit">Guardar</button>
      </form>`);
    const h = $('hoja');
    h.querySelector('[data-cerrar]').onclick = cerrarHoja;
    const campo = id => h.querySelector(`input[data-item="${id}"]`);
    h.querySelectorAll('[data-mas]').forEach(b => b.onclick = () => { const c = campo(b.dataset.mas); c.value = (parseInt(c.value, 10) || 0) + 1; });
    h.querySelectorAll('[data-menos]').forEach(b => b.onclick = () => { const c = campo(b.dataset.menos), n = (parseInt(c.value, 10) || 0) - 1; c.value = n > 0 ? n : (c.value === '' ? '' : 0); });
    $('mTipo').onchange = () => { const m = MOV[$('mTipo').value]; $('mTitulo').textContent = m.t; $('mNota').placeholder = m.nota; h.querySelector('.cab h2').textContent = m.i + ' ' + m.n; };
    $('formMov').onsubmit = async e => {
      e.preventDefault();
      const t = $('mTipo').value;
      const movs = Array.from(h.querySelectorAll('input[data-item]')).filter(c => c.value !== '' && (t === 'conteo' || +c.value > 0))
        .map(c => ({ tipo: t, item: c.dataset.item, cantidad: +c.value, fecha: $('mFecha').value, nota: $('mNota').value }));
      if (!movs.length) { toast('Escribe al menos una cantidad'); return; }
      const btn = e.target.querySelector('button[type=submit]'); btn.disabled = true;
      if (await cargarInventario({ accion: 'inv-guardar', movs })) { cerrarHoja(); toast(MOV[t].i + ' Guardado en el inventario'); } else btn.disabled = false;
    };
  }

  // Inicio
  if (token) { $('app').classList.remove('oculto'); cargar(); } else mostrarLogin();
})();
</script>
</body>
</html>
