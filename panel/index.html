button,input,select,textarea{font:inherit;color:inherit}

.oculto{display:none!important}
/* Login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
#login form{background:#fff;border-radius:24px;padding:28px 22px;width:100%;max-width:360px;text-align:center;box-shadow:0 6px 24px rgba(45,67,117,.08)}

/* Cabecera */
header{position:sticky;top:0;z-index:5;background:var(--fondo);padding:12px 16px 8px;border-bottom:1px solid var(--borde)}
.fila{display:flex;align-items:center;gap:10px}

.naranja{background:var(--naranja);color:#2b1a12}.azul{background:var(--azul);color:#fff}.claro{background:#fff;color:var(--navy);border:1.5px solid var(--borde)}
.verde{background:#25d366;color:#0b3d1f}.rojo{background:#fff;color:#b3261e;border:1.5px solid #f2c7c3}.lima{background:var(--lima);color:#3d3d00}
.ancho{width:100%}
.icono{width:42px;height:42px;padding:0;border-radius:12px}
/* Resumen */
main{max-width:860px;margin:0 auto;padding:12px 16px 100px}
.resumen{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:4px 0 14px}

.dato.activo{border-color:var(--azul)}

/* Filtros */
.filtros{display:flex;flex-wrap:wrap;gap:8px;padding:2px 0 10px}
.filtros::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:1.5px solid var(--borde);background:#fff;border-radius:999px;padding:7px 13px;font-weight:800;font-size:13px;cursor:pointer}
.chip.activo{background:var(--navy);border-color:var(--navy);color:#fff}
.armar .armar-item{padding:10px 0;border-top:1px dashed var(--borde)}.armar .armar-item:first-of-type{border-top:0;padding-top:0}
.armar-t{font-weight:900;font-size:14px;margin-bottom:6px}
.armar .cn.armar-cn{background:none;padding:0;margin:0;display:block}
.armar .armar-cn .cn-stage{padding:6px 10px}

.armar-collar{display:flex;flex-wrap:wrap;gap:4px;background:#b8d8f5;border-radius:12px;padding:8px 10px;border:2px solid #9cc4ea}
.armar-l{display:inline-grid;place-items:center;min-width:34px;height:42px;padding:0 4px;border-radius:9px;background:var(--c);border-bottom:4px solid var(--e);color:#fff;font-weight:900;font-size:22px;font-family:'Fredoka One','Nunito',sans-serif;text-shadow:0 1px 0 rgba(0,0,0,.25)}

.e-por-confirmar{background:#fff1cc;color:#8a5a00}.e-confirmado{background:#e3eafb;color:#2f4a96}.e-preparando{background:#f3f3c4;color:#5c5c00}

  max-width:640px;margin:0 auto;box-shadow:0 -8px 30px rgba(0,0,0,.12)}

label{display:block;font-size:12px;font-weight:800;color:var(--gris);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.03em}

input,select,textarea{width:100%;border:1.5px solid var(--borde);border-radius:12px;padding:10px 12px;background:#fff;font-size:16px}

.dos{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.nom-mezcla .pz.claro{color:#2d4375}.nom-mezcla .pin{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;font-weight:700}

.nom-mezcla .pin button.activo{box-shadow:0 0 0 3px #2d4375}.nom-mezcla .lnk{background:none;border:0;color:#4964af;font-weight:800;text-decoration:underline;cursor:pointer;width:auto;height:auto;padding:0 4px;font-size:13px}
.nom-fila{display:flex;gap:6px;width:100%;margin-top:4px}.nom-fila .nom-ico{width:36px;height:auto;min-height:36px;font-size:18px;color:#d9338f;background:#fff;border:1.5px solid var(--borde)}.nom-fila input{flex:1;min-width:0;padding:8px 10px;font-size:15px;text-transform:uppercase}.nom-fila select{width:auto;padding:8px;font-size:14px}.items button{border:0;background:#f3eee6;border-radius:8px;width:28px;height:28px;cursor:pointer;font-weight:800}
.aviso-extras{margin-top:10px;background:#fff4e0;border:1.5px solid #ffd59a;border-radius:12px;padding:10px 12px;font-size:14px}.aviso-extras.oculto{display:none}
.tallas{display:flex;gap:6px;align-items:center;font-size:13px;font-weight:800;margin-top:4px}
.aviso{background:#fff7e0;border-radius:12px;padding:10px 12px;font-size:14px}
.nota-chica{font-size:12px;color:var(--gris);margin-top:4px}

.btn-borrar{margin-left:8px;border:0;background:transparent;font-size:17px;cursor:pointer;opacity:.55;padding:2px 4px;vertical-align:middle}.btn-borrar:hover{opacity:1}
.opciones-envio{display:grid;gap:6px;margin-top:10px}.opcion-envio{display:flex;gap:10px;align-items:flex-start;background:var(--fondo);border-radius:12px;padding:10px;font-weight:400}.opcion-envio small{display:block;color:var(--gris);font-size:12px}.opcion-envio input{margin-top:3px}

.stock{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:16px}

.tabla-caja{overflow-x:auto;margin:0 -4px}

<script>
(function () {
  'use strict';
  const API = '/.netlify/functions/panel-pedidos';
  const WHATSAPP_TIENDA = '573176431286';
  const DIAS_ENTREGA = 3; // días hábiles prometidos para despachar

  // Productos para agregar rápido (mismos precios de la web: netlify/lib/tienda.js y assets/collar-nombre.json)
  const CATALOGO = [
    { id: 'combo', n: 'Combo completo', p: 149900, talla: true },
    { id: 'arnes-correa', n: 'Arnés + correa', p: 109900, talla: true },
    { id: 'collar-correa', n: 'Collar + correa', p: 89900, talla: true },
    { id: 'collar-correa-nombre', n: 'Collar con nombre + correa', p: 109900, talla: true },
    { id: 'correa-nombre', n: 'Correa con nombre', p: 79900, talla: false },
    { id: 'arnes-correa-nombre', n: 'Arnés + correa con nombre', p: 129900, talla: true },
    { id: 'combo-nombre', n: 'Combo completo con collar con nombre', p: 169900, talla: true },
    { id: 'arnes', n: 'Arnés tipo H', p: 69900, talla: true },
    { id: 'collar-nombre', n: 'Collar con nombre', p: 64900, talla: true },
    { id: 'collar', n: 'Collar', p: 44900, talla: true },
    { id: 'correa', n: 'Correa', p: 59900, talla: false },
    { id: 'placa', n: 'Placa Inteligente', p: 29900, talla: false },
    { id: 'placa-add', n: 'Placa (con otro producto)', p: 19900, talla: false },
    { id: 'letra', n: 'Letra extra', p: 5000, talla: false }
  ];
  // Editor de productos con los botones del catálogo: lo que se elige aquí es lo que cuenta el inventario
  // (un combo talla M = 1 collar M + 1 arnés M + 1 correa). Devuelve { items, texto, total }.
  const CON_NOMBRE = ['collar-nombre', 'collar-correa-nombre', 'combo-nombre', 'correa-nombre', 'arnes-correa-nombre'];
  const LETRAS_INCLUIDAS = 5, PRECIO_LETRA_EXTRA = 5000; // igual que assets/collar-nombre.json (incluidas / precioExtra)
  const contarLetras = t => Array.from(String(t || '').toUpperCase()).map(ch => (ch === '♥' || ch === '★') ? ch : ch.normalize('NFD').replace(/[\u0300-\u036f]/g, '')).filter(ch => /^[A-Z]$/.test(ch) || ch === '♥' || ch === '★').length;
  function editorInv(cont, inicial, alCambiar, alUsarTotal) {
    let talla = 'S';
    const items = (inicial || []).map(it => ({ id: it.p, talla: it.talla || '', q: it.q || 1, nombre: it.nombre ? { texto: it.nombre.texto || '', color: it.nombre.color || 'rosado', mezcla: Array.isArray(it.nombre.mezcla) ? it.nombre.mezcla.slice() : [] } : null, regalo: !!it.regalo }));
    // Combinar colores (como en la web): mezcla[i] = color de la pieza i (letra, ♥ o ★); vacío = el color de las letras
    const piezasDe = t => Array.from(String(t || '').toUpperCase()).map(ch => (ch === '♥' || ch === '★') ? ch : ch.normalize('NFD').replace(/[\u0300-\u036f]/g, '')).filter(ch => /^[A-Z]$/.test(ch) || ch === '♥' || ch === '★');
    const colorDe = id => CN_COLORES.find(c => c.id === id) || { id, nombre: id, main: '#ccc', edge: '#999' };
    const coloresDe = it => piezasDe(it.nombre.texto).map((ch, k) => colorDe((it.nombre.mezcla || [])[k] || it.nombre.color));
    const usadosDe = it => coloresDe(it).map(c => c.nombre).filter((n, k, a) => a.indexOf(n) === k);
    const mezclaLimpia = it => { const m = piezasDe(it.nombre.texto).map((ch, k) => { const c = (it.nombre.mezcla || [])[k] || ''; return c === it.nombre.color ? '' : c; }); return m.some(Boolean) ? m : []; };
    const cat = id => CATALOGO.find(c => c.id === id) || { n: id, p: 0, talla: false };
    const extrasDe = it => (it.nombre && it.nombre.texto) ? Math.max(0, contarLetras(it.nombre.texto) - LETRAS_INCLUIDAS) : 0; // por unidad
    const precioLinea = it => (cat(it.id).p + extrasDe(it) * PRECIO_LETRA_EXTRA) * it.q;
    const linea = it => cat(it.id).n + (it.talla ? ' (Talla ' + it.talla + ')' : '') + (it.nombre && it.nombre.texto ? ' · "' + it.nombre.texto.toUpperCase() + '" letras ' + (usadosDe(it).length > 1 ? 'combinadas (' + usadosDe(it).join(', ') + ')' : (usadosDe(it)[0] || colorDe(it.nombre.color).nombre)) + (extrasDe(it) ? ' · ' + extrasDe(it) + (extrasDe(it) === 1 ? ' letra extra' : ' letras extra') : '') : '') + (it.regalo ? ' [REGALO]' : '') + (it.q > 1 ? ' x' + it.q : '');
    cont.innerHTML = `<div class="tallas">Talla: <button type="button" class="chip activo" data-etalla="S">S</button><button type="button" class="chip" data-etalla="M">M</button></div>
      <div class="catalogo">${CATALOGO.map(x => `<button type="button" class="chip" data-ep="${x.id}">＋ ${esc(x.n)} · ${pesos(x.p * 100)}</button>`).join('')}</div>
      <ul class="items" data-elista></ul>
      <div class="aviso-extras oculto" data-eaviso></div>`;
    const lista = cont.querySelector('[data-elista]');
    const aviso = cont.querySelector('[data-eaviso]');
    const avisar = () => {
      const n = items.reduce((a, it) => a + extrasDe(it) * it.q, 0);
      aviso.classList.toggle('oculto', !n);
      if (!n) { aviso.innerHTML = ''; return; }
      const tot = items.reduce((a, it) => a + precioLinea(it), 0);
      aviso.innerHTML = `✏️ <b>${n} ${n === 1 ? 'letra extra' : 'letras extra'}</b> × ${pesos(PRECIO_LETRA_EXTRA * 100)} = <b>${pesos(n * PRECIO_LETRA_EXTRA * 100)}</b> por cobrar. Total con las letras: <b>${pesos(tot * 100)}</b>` + (alUsarTotal ? ` <button type="button" class="btn azul" data-eusar style="padding:6px 10px;margin-top:6px">Poner este total</button>` : '');
      const b = aviso.querySelector('[data-eusar]'); if (b) b.onclick = () => alUsarTotal(tot);
    };
    // Las piezas del nombre: elige un color (pincel) y toca las letras o figuras para pintarlas
    const pintarMezcla = i => {
      const d = lista.querySelector('[data-emez="' + i + '"]'), it = items[i];
      if (!d || !it || !it.nombre) return;
      const pzs = piezasDe(it.nombre.texto);
      if (!pzs.length) { d.innerHTML = ''; return; }
      if (!it.pincel || it.pincel === it.nombre.color) it.pincel = (CN_COLORES.find(c => c.id !== it.nombre.color && !c.oculto) || CN_COLORES[0]).id;
      const cols = coloresDe(it);
      d.innerHTML = `<div class="pin">🎨 Combinar: elige un color y toca las letras ${CN_COLORES.map(c => `<button type="button" data-pin="${c.id}" class="${it.pincel === c.id ? 'activo' : ''}" style="--c:${esc(c.main)}" title="${esc(c.nombre)}${c.oculto ? ' (no se ofrece en la web)' : ''}" aria-label="${esc(c.nombre)}"></button>`).join('')}</div>
        <div class="pzs">${pzs.map((ch, k) => `<button type="button" class="pz${claro(cols[k].main) ? ' claro' : ''}" data-pz="${k}" style="--c:${esc(cols[k].main)};--e:${esc(cols[k].edge || cols[k].main)}" title="${k + 1}. ${esc(ch)} · ${esc(cols[k].nombre)}">${esc(ch)}</button>`).join('')}</div>
        ${usadosDe(it).length > 1 ? `<button type="button" class="lnk" data-todas>Todas del color de las letras</button>` : ''}`;
      d.querySelectorAll('[data-pin]').forEach(b => b.onclick = () => { it.pincel = b.dataset.pin; pintarMezcla(i); });
      d.querySelectorAll('[data-pz]').forEach(b => b.onclick = () => {
        const k = +b.dataset.pz, m = it.nombre.mezcla = (it.nombre.mezcla || []).slice();
        m[k] = (m[k] || it.nombre.color) === it.pincel ? '' : it.pincel;
        actualizarLinea(i);
      });
      const t = d.querySelector('[data-todas]'); if (t) t.onclick = () => { it.nombre.mezcla = []; actualizarLinea(i); };
    };
    const actualizarLinea = i => { const li = lista.querySelectorAll('li')[i], it = items[i]; li.querySelector('span').textContent = linea(it); pintarMezcla(i); if (alCambiar) alCambiar(); };
    const pintar = () => {
      lista.innerHTML = items.map((it, i) => `<li class="${CON_NOMBRE.includes(it.id) ? 'con-nombre' : ''}"><span>${esc(linea(it))}</span><b>${pesos(precioLinea(it) * 100)}</b><button type="button" data-emenos="${i}" aria-label="Quitar uno">−</button><button type="button" data-emas="${i}" aria-label="Agregar uno">＋</button>
        ${CON_NOMBRE.includes(it.id) ? `<div class="nom-fila"><input data-enom="${i}" maxlength="8" placeholder="Nombre (ej. OLIVER)" value="${esc(it.nombre ? it.nombre.texto : '')}" autocomplete="off"><button type="button" class="nom-ico" data-eico="${i}" data-ch="♥" title="Agregar corazón" aria-label="Agregar corazón">♥</button><button type="button" class="nom-ico" data-eico="${i}" data-ch="★" title="Agregar estrella" aria-label="Agregar estrella">★</button><select data-ecol="${i}">${CN_COLORES.map(c => `<option value="${c.id}"${it.nombre && it.nombre.color === c.id ? ' selected' : ''}>${esc(c.nombre)}</option>`).join('')}</select></div><div class="nom-mezcla" data-emez="${i}"></div>` : ''}</li>`).join('')
        || '<li class="nota-chica" style="border:0">Toca los productos que lleva (elige primero la talla).</li>';
      lista.querySelectorAll('[data-emenos]').forEach(b => b.onclick = () => { const it = items[b.dataset.emenos]; it.q--; if (it.q < 1) items.splice(b.dataset.emenos, 1); pintar(); });
      lista.querySelectorAll('[data-emas]').forEach(b => b.onclick = () => { items[b.dataset.emas].q++; pintar(); });
      // ♥ y ★ también van en el nombre (como en la web)
      lista.querySelectorAll('[data-eico]').forEach(b => b.onclick = () => {
        const inp = lista.querySelector('[data-enom="' + b.dataset.eico + '"]');
        if (Array.from(inp.value).length >= 8) { toast('Máximo 8 letras o figuras'); return; }
        inp.value += b.dataset.ch; inp.oninput(); inp.focus();
      });
      lista.querySelectorAll('[data-enom]').forEach(inp => inp.oninput = () => { const it = items[inp.dataset.enom]; it.nombre = it.nombre || { color: 'rosado', mezcla: [] }; it.nombre.texto = inp.value.toUpperCase(); const li = lista.querySelectorAll('li')[inp.dataset.enom]; li.querySelector('span').textContent = linea(it); li.querySelector('b').textContent = pesos(precioLinea(it) * 100); pintarMezcla(+inp.dataset.enom); avisar(); if (alCambiar) alCambiar(); });
      lista.querySelectorAll('[data-emez]').forEach(d => pintarMezcla(+d.dataset.emez));
      lista.querySelectorAll('[data-ecol]').forEach(sel => sel.onchange = () => { const it = items[sel.dataset.ecol]; it.nombre = it.nombre || { texto: '', mezcla: [] }; it.nombre.color = sel.value; pintar(); });
      avisar();
      if (alCambiar) alCambiar();
    };
    cont.querySelectorAll('[data-etalla]').forEach(b => b.onclick = () => { talla = b.dataset.etalla; cont.querySelectorAll('[data-etalla]').forEach(x => x.classList.toggle('activo', x === b)); });
    cont.querySelectorAll('[data-ep]').forEach(b => b.onclick = () => {
      const x = cat(b.dataset.ep), t = x.talla ? talla : '';
      const ya = items.find(it => it.id === x.id && it.talla === t && !CON_NOMBRE.includes(x.id));
      if (ya) ya.q++; else items.push({ id: x.id, talla: t, q: 1, nombre: CON_NOMBRE.includes(x.id) ? { texto: '', color: 'rosado', mezcla: [] } : null });
      pintar();
    });
    pintar();
    return {
      items: () => items.map(it => Object.assign({ p: it.id, talla: it.talla, q: it.q }, it.nombre && it.nombre.texto ? { nombre: Object.assign({ texto: it.nombre.texto, color: it.nombre.color }, mezclaLimpia(it).length ? { mezcla: mezclaLimpia(it) } : {}) } : {}, it.regalo ? { regalo: true } : {})),
      texto: () => items.map(linea).join('\n'),
      total: () => items.reduce((n, it) => n + precioLinea(it), 0)
    };
  }
  // Colores de las letras (assets/collar-nombre.json), para el nombre del collar en el editor
  let CN_COLORES = [{ id: 'rosado', nombre: 'Rosado' }];
  fetch('/assets/collar-nombre.json').then(r => r.json()).then(j => { CN_COLORES = j.colores; }).catch(() => {});
  const ESTADOS = [
    { id: 'por-confirmar', n: 'Por confirmar', i: '🕐' },
    { id: 'confirmado', n: 'Confirmado', i: '👍' },
    { id: 'preparando', n: 'Preparando', i: '✂️' },
    { id: 'enviado', n: 'Enviado', i: '🚚' },
    { id: 'entregado', n: 'Entregado', i: '🎉' },
    { id: 'cancelado', n: 'Cancelado', i: '✖' },
    { id: 'devuelto', n: 'Devuelto', i: '↩' }
  ];
  const EST = Object.fromEntries(ESTADOS.map(e => [e.id, e]));
  const ORIGENES = { web: '🌐 Web', whatsapp: '💬 WhatsApp', instagram: '📸 Instagram', facebook: '👍 Facebook', tiktok: '🎵 TikTok', marketplace: '🛒 Marketplace', stand: '⛺ Stand', consignacion: '🏪 Consignación', otro: '✳️ Otro' };
  const TIPOS = { venta: '💰 Venta', colaboracion: '🤝 Colaboración', regalo: '🎁 Regalo' };
  const PAGOS = { contraentrega: '💵 Contraentrega', wompi: '💳 Wompi', nequi: '📲 Nequi / Bre-B', transferencia: '🏦 Transferencia', efectivo: '💵 Efectivo', otro: 'Otro' };
  const FILTROS = [
    { id: 'activos', n: 'Activos', f: p => ['por-confirmar', 'confirmado', 'preparando', 'enviado'].includes(p.estado) },
    { id: 'por-confirmar', n: '🕐 Por confirmar', f: p => p.estado === 'por-confirmar' },
    { id: 'despachar', n: '📦 Por despachar', f: p => ['confirmado', 'preparando'].includes(p.estado) },
    { id: 'enviado', n: '🚚 En camino', f: p => p.estado === 'enviado' },
    { id: 'cobrar', n: '💵 Por cobrar', f: p => !p.pagado && !['cancelado', 'devuelto'].includes(p.estado) },
    { id: 'entregado', n: '🎉 Entregados', f: p => p.estado === 'entregado' },
    { id: 'resena', n: '⭐ Pedir reseña', f: p => p.estado === 'entregado' && !p.resenaPedida && !!(p.cliente && p.cliente.telefono) && (p.tipo || 'venta') === 'venta' },
    { id: 'promo', n: '🖤 Black Wuuff', f: p => !!p.promo },
    { id: 'cerrados', n: '✖ Cancelados', f: p => ['cancelado', 'devuelto'].includes(p.estado) },
    { id: 'todos', n: 'Todos', f: () => true }
  ];

  let token = leer('wuuffPanelToken');
  let pedidos = [];
  let filtro = 'activos';
  let texto = '';

  const $ = id => document.getElementById(id);
  function leer(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
  function guardar(k, v) { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch (e) {} }
  function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
  function pesos(c) { return '$' + Math.round((c || 0) / 100).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
  function numero(v) { return parseInt(String(v || '').replace(/[^\d]/g, ''), 10) || 0; }
  // Enlace de WhatsApp con el mensaje escrito. Se usa api.whatsapp.com/send y no wa.me: con wa.me, WhatsApp Web
  // y la app de computador muestran los emojis como "�".
  function waLink(p, texto) { return 'https://api.whatsapp.com/send?phone=' + telWa(p.cliente && p.cliente.telefono) + '&text=' + encodeURIComponent(texto); }
  function telWa(t) { const d = String(t || '').replace(/\D/g, ''); return d.length === 10 ? '57' + d : d; }
  function primerNombre(n) { return String(n || '').trim().split(/\s+/)[0] || ''; }
  function fecha(iso) {
    const d = new Date(iso); if (isNaN(d)) return '';
    return d.toLocaleDateString('es-CO', { day: 'numeric', month: 'short' }) + ' · ' + d.toLocaleTimeString('es-CO', { hour: 'numeric', minute: '2-digit' });
  }
  function hace(iso) {
    const ms = Date.now() - new Date(iso).getTime(), h = ms / 36e5;
    if (h < 1) return 'hace un rato'; if (h < 24) return 'hace ' + Math.floor(h) + ' h';
    const d = Math.floor(h / 24); return d === 1 ? 'ayer' : 'hace ' + d + ' días';
  }
  function diasHabiles(desde) {
    let d = new Date(desde), n = 0; const hoy = new Date();
    d.setHours(0, 0, 0, 0); hoy.setHours(0, 0, 0, 0);
    while (d < hoy) { d.setDate(d.getDate() + 1); const w = d.getDay(); if (w !== 0 && w !== 6) n++; }
    return n;
  }
  function atrasado(p) { return ['confirmado', 'preparando'].includes(p.estado) && diasHabiles(p.creado) > DIAS_ENTREGA; }
  function toast(t) { const el = $('toast'); el.textContent = t; el.classList.remove('oculto'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.add('oculto'), 2600); }

  async function api(metodo, cuerpo) {
    const r = await fetch(API, {
      method: metodo,
      headers: Object.assign({ 'Content-Type': 'application/json' }, token ? { Authorization: 'Bearer ' + token } : {}),
      body: cuerpo ? JSON.stringify(cuerpo) : undefined
    });
    const nuevo = r.headers.get('X-Panel-Token');
    if (nuevo && token) { token = nuevo; guardar('wuuffPanelToken', token); }
    let j = {}; try { j = await r.json(); } catch (e) {}
    if (r.status === 401 && j.sesion === false) { salir(); throw new Error('La sesión venció. Vuelve a entrar.'); }
    if (!r.ok) throw new Error(j.error || 'Algo falló (' + r.status + ')');
    return j;
  }

  // ── Sesión ──
  function mostrarLogin() { $('app').classList.add('oculto'); $('login').classList.remove('oculto'); setTimeout(() => $('clave').focus(), 50); }
  function salir() { token = ''; guardar('wuuffPanelToken', ''); cerrarHoja(); mostrarLogin(); }
  // Se cierra sola a los 30 minutos sin usar el panel (sin tocar, escribir ni desplazar)
  const INACTIVO_MS = 30 * 60 * 1000;
  const usar = () => { if (token) guardar('wuuffPanelUso', String(Date.now())); };
  ['click', 'keydown', 'touchstart', 'scroll', 'input'].forEach(ev => document.addEventListener(ev, usar, { passive: true, capture: true }));
  function revisarInactividad() {
    const ultimo = parseInt(leer('wuuffPanelUso'), 10) || 0;
    if (token && ultimo && Date.now() - ultimo > INACTIVO_MS) {
      salir(); $('loginError').textContent = '🔒 Cerramos la sesión porque pasaron 30 minutos sin usar el panel.'; $('loginError').classList.remove('oculto');
      return true;
    }
    return false;
  }
  setInterval(revisarInactividad, 30000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) revisarInactividad(); });
  $('formLogin').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = e.target.querySelector('button[type=submit]'); btn.disabled = true; $('loginError').classList.add('oculto');
    try {
      const j = await api('POST', { accion: 'entrar', clave: $('clave').value });
      token = j.token; guardar('wuuffPanelToken', token); usar(); $('clave').value = '';
      $('login').classList.add('oculto'); $('app').classList.remove('oculto'); cargar();
    } catch (err) { $('loginError').textContent = err.message; $('loginError').classList.remove('oculto'); }
    btn.disabled = false;
  });
  $('btnSalir').onclick = salir;

  // ── Cargar y pintar ──
  async function cargar() {
    $('actualizado').textContent = 'Cargando…';
    try {
      const j = await api('GET');
      pedidos = j.pedidos || [];
      $('actualizado').textContent = 'Actualizado ' + new Date().toLocaleTimeString('es-CO', { hour: 'numeric', minute: '2-digit' });
      pintar();
    } catch (err) { $('actualizado').textContent = err.message; }
  }
  $('btnRecargar').onclick = cargar;
  document.addEventListener('visibilitychange', () => { if (!document.hidden && token && $('hoja').classList.contains('oculto')) cargar(); });

  function pintar() {
    // Resumen
    const ahora = new Date(), mes = ahora.getFullYear() + '-' + ahora.getMonth();
    const vivos = pedidos.filter(p => !['cancelado', 'devuelto'].includes(p.estado));
    const delMes = vivos.filter(p => { const d = new Date(p.creado); return d.getFullYear() + '-' + d.getMonth() === mes && (p.tipo || 'venta') === 'venta'; });
    const porCobrar = vivos.filter(p => !p.pagado);
    const atrasados = pedidos.filter(atrasado).length;
    const despachar = pedidos.filter(p => ['confirmado', 'preparando'].includes(p.estado)).length;
    const datos = [
      { f: 'por-confirmar', v: pedidos.filter(p => p.estado === 'por-confirmar').length, t: '🕐 Por confirmar' },
      { f: 'despachar', v: despachar, t: atrasados ? '📦 Por despachar · ' + atrasados + ' atrasado' + (atrasados > 1 ? 's' : '') : '📦 Por despachar', alerta: atrasados > 0 },
      { f: 'enviado', v: pedidos.filter(p => p.estado === 'enviado').length, t: '🚚 En camino' },
      { f: 'cobrar', v: pesos(porCobrar.reduce((s, p) => s + (p.totalCents || 0), 0)), t: '💵 Por cobrar (' + porCobrar.length + ')' },
      { f: 'todos', v: pesos(delMes.reduce((s, p) => s + (p.totalCents || 0), 0)), t: '✨ Vendido este mes (' + delMes.length + ')' }
    ];
    $('resumen').innerHTML = datos.map(d => `<button class="dato${filtro === d.f ? ' activo' : ''}${d.alerta ? ' alerta' : ''}" data-f="${d.f}"><b>${esc(d.v)}</b><span>${esc(d.t)}</span></button>`).join('');
    $('resumen').querySelectorAll('.dato').forEach(b => b.onclick = () => { filtro = b.dataset.f; pintar(); });
    // Filtros
    $('filtros').innerHTML = FILTROS.map(f => `<button class="chip${filtro === f.id ? ' activo' : ''}" data-f="${f.id}">${esc(f.n)} <span style="opacity:.7">${pedidos.filter(f.f).length}</span></button>`).join('');
    $('filtros').querySelectorAll('.chip').forEach(b => b.onclick = () => { filtro = b.dataset.f; pintar(); });
    // Lista
    const ff = (FILTROS.find(f => f.id === filtro) || FILTROS[0]).f;
    const q = texto.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
    const lista = pedidos.filter(ff).filter(p => !q || [p.id, p.numero ? '#' + p.numero : '', p.cliente && p.cliente.nombre, p.cliente && p.cliente.telefono, p.mascota, p.productos, p.notas, p.guia && p.guia.numero, p.cliente && p.cliente.direccion]
      .join(' ').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').includes(q));
    // Lo urgente primero: atrasados, por confirmar, por despachar; luego el resto por fecha
    const peso = p => atrasado(p) ? 0 : ({ 'por-confirmar': 1, confirmado: 2, preparando: 2, enviado: 3 }[p.estado] || 4);
    lista.sort((a, b) => peso(a) - peso(b) || (a.creado < b.creado ? 1 : -1));
    $('lista').innerHTML = lista.length ? lista.map(tarjeta).join('') :
      (pedidos.length ? '<div class="vacio"><div class="titulo">Nada por aquí</div>No hay pedidos en este filtro.</div>'
        : '<div class="vacio"><div class="titulo">Aún no hay pedidos 🐾</div>Los de la web llegan solos. Los de WhatsApp, Instagram o el stand agrégalos con <b>＋ Nuevo</b>.</div>');
    $('lista').querySelectorAll('.pedido').forEach(el => el.onclick = e => {
      const acc = e.target.closest('[data-accion]');
      if (acc) { e.stopPropagation(); if (acc.dataset.accion === 'avanzar') avanzar(el.dataset.id); if (acc.dataset.accion === 'borrar') borrarPedido(el.dataset.id); if (acc.dataset.accion === 'abrir') abrirDetalle(el.dataset.id); if (acc.dataset.accion === 'etiqueta') abrirEtiqueta(el.dataset.id); return; }
      abrirDetalle(el.dataset.id);
    });
  }

  function siguienteEstado(p) {
    return { 'por-confirmar': 'confirmado', confirmado: 'preparando', preparando: 'enviado', enviado: 'entregado' }[p.estado];
  }

  // ── Etiqueta para el paquete (imagen 15 × 10 cm para imprimir y pegar) ──
  const DEPTOS = ['Amazonas', 'Antioquia', 'Arauca', 'Atlántico', 'Bolívar', 'Boyacá', 'Caldas', 'Caquetá', 'Casanare', 'Cauca', 'Cesar', 'Chocó', 'Córdoba',
    'Cundinamarca', 'Guainía', 'Guaviare', 'Huila', 'La Guajira', 'Magdalena', 'Meta', 'Nariño', 'Norte de Santander', 'Putumayo', 'Quindío', 'Risaralda',
    'San Andrés', 'Santander', 'Sucre', 'Tolima', 'Valle del Cauca', 'Vaupés', 'Vichada'];
  const sinTilde = t => String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  // "SOACHA CUNDINAMARCA" / "Madrid, Cundinamarca" / "Bogotá" → { ciudad, depto }
  function partirCiudad(txt) {
    let t = String(txt || '').trim();
    if (!t) return { ciudad: '', depto: '' };
    if (/bogot/i.test(t)) return { ciudad: 'Bogotá', depto: 'D.C.' };
    if (t.includes(',')) { const [a, ...b] = t.split(','); return { ciudad: a.trim(), depto: b.join(',').trim() }; }
    const d = DEPTOS.slice().sort((a, b) => b.length - a.length).find(x => sinTilde(t).endsWith(' ' + sinTilde(x)));
    if (d) return { ciudad: t.slice(0, t.length - d.length).trim(), depto: d };
    return { ciudad: t, depto: '' };
  }
  function telBonito(t) { const d = String(t || '').replace(/\D/g, '').replace(/^57(?=\d{10}$)/, ''); return d.length === 10 ? d.replace(/(\d{3})(\d{3})(\d{4})/, '$1 $2 $3') : String(t || ''); }
  function contenidoCorto(p) {
    return String(p.productos || '').replace(/\s*\|\s*Perfil NFC:.*$/, '').replace(/\s*\[[^\]]*\]/g, '').replace(/\s+/g, ' ').trim().slice(0, 110);
  }
  const logoEtiqueta = new Image(); logoEtiqueta.src = '/images/wuuff-puppy.png';

  function abrirEtiqueta(id) {

    const c = p.cliente || {}, cd = partirCiudad(c.ciudad);
    const sugerencias = ['PREMIO · FINALISTA', 'PREMIO · GANADOR', 'REGALO', 'PEDIDO WEB', 'FRÁGIL'];
    abrirHoja(`

        <label for="etqCobro">Cobro al entregar</label>
        <select id="etqCobro"><option value="no"${p.pagado ? ' selected' : ''}>Sin cobro · no recaudo</option><option value="si"${p.pagado ? '' : ' selected'}>Cobrar ${pesos(p.totalCents)} al entregar</option></select>
        <label for="etqSello">Sello de arriba (opcional)</label><input id="etqSello" placeholder="Ej.: PREMIO · FINALISTA" value="${p.codigo && p.codigo.tipo === 'concurso' ? 'PREMIO · FINALISTA' : ''}">
        <div class="catalogo" style="margin-top:6px">${sugerencias.map(s => `<button type="button" class="chip" data-sello="${esc(s)}">${esc(s)}</button>`).join('')}<button type="button" class="chip" data-sello="">Sin sello</button></div>
      </div>`);
    const h = $('hoja'), cv = $('etqCanvas');
    const datos = () => ({ nombre: $('etqNombre').value.trim(), tel: $('etqTel').value.trim(), dir: $('etqDir').value.trim(), ciudad: $('etqCiudad').value.trim(),
      depto: $('etqDepto').value.trim(), cont: $('etqCont').value.trim(), cobrar: $('etqCobro').value === 'si' ? p.totalCents : 0, sello: $('etqSello').value.trim(), numero: p.numero || '' });
    const pintarEtq = () => dibujarEtiqueta(cv.getContext('2d'), datos());
    h.querySelector('[data-cerrar]').onclick = cerrarHoja;

    const archivo = () => 'etiqueta-' + sinTilde(datos().nombre || p.id).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') + '.png';
    $('etqDescargar').onclick = () => cv.toBlob(b => { const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = archivo(); document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); });
    $('etqImprimir').onclick = () => {

      w.document.write('<!doctype html><title>Etiqueta</title><style>@page{size:15cm 10cm;margin:0}html,body{margin:0}img{width:15cm;height:10cm;display:block}</style><img src="' + cv.toDataURL('image/png') + '" onload="setTimeout(function(){print()},200)">');

    const listo = document.fonts && document.fonts.load ? Promise.all([document.fonts.load('800 40px Nunito'), document.fonts.load('40px "Fredoka One"')]) : Promise.resolve();
    listo.then(pintarEtq, pintarEtq); if (!logoEtiqueta.complete) logoEtiqueta.onload = pintarEtq;
    pintarEtq();

  function dibujarEtiqueta(ctx, d) {
    const W = 1800, H = 1200, M = 68, AZUL = '#4964af', NAVY = '#2d4375', ROSA = '#d3889f', NARANJA = '#ff7d57', LIMA = '#d5d50c', FONDO = '#fdeee8';
    const F = (peso, t) => peso + ' ' + t + "px Nunito, 'Arial Rounded MT Bold', Arial, sans-serif";
    function redondo(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
    // texto que se achica hasta caber en el ancho
    function ajustar(t, peso, tam, ancho, min) { let s = tam; ctx.font = F(peso, s); while (s > (min || 20) && ctx.measureText(t).width > ancho) { s -= 2; ctx.font = F(peso, s); } return s; }
    // texto en varias líneas (máximo "max")
    function lineas(t, ancho, max) {
      const pal = String(t).split(/\s+/), out = []; let l = '';
      pal.forEach(w => { const p = l ? l + ' ' + w : w; if (ctx.measureText(p).width > ancho && l) { out.push(l); l = w; } else l = p; });
      if (l) out.push(l);
      if (out.length > max) { out.length = max; out[max - 1] = out[max - 1].replace(/\s*\S*$/, '') + '…'; }
      return out;
    }
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#fff'; redondo(0, 0, W, H, 40); ctx.fill();
    // cabecera: logo y sello
    if (logoEtiqueta.complete && logoEtiqueta.naturalWidth) { const lh = 150, lw = lh * logoEtiqueta.naturalWidth / logoEtiqueta.naturalHeight; ctx.drawImage(logoEtiqueta, M - 10, 14, lw, lh); }
    if (d.sello) {
      const s = ajustar(d.sello.toUpperCase(), 800, 40, 700, 24), tw = ctx.measureText(d.sello.toUpperCase()).width, pw = tw + 72, ph = 80;
      ctx.fillStyle = ROSA; redondo(W - M + 16 - pw, 56, pw, ph, ph / 2); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.textBaseline = 'middle'; ctx.textAlign = 'center'; ctx.fillText(d.sello.toUpperCase(), W - M + 16 - pw / 2, 56 + ph / 2 + 2);
    }
    // cuerpo con borde azul
    const top = 184;
    ctx.fillStyle = FONDO; redondo(14, top, W - 28, H - top - 14, 36); ctx.fill();
    ctx.strokeStyle = AZUL; ctx.lineWidth = 7; redondo(14, top, W - 28, H - top - 14, 36); ctx.stroke();
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    let y = top + 82;
    ctx.fillStyle = ROSA; ctx.font = F(800, 34); ctx.fillText('PARA', M, y);
    if (d.numero) { ctx.textAlign = 'right'; ctx.fillStyle = NAVY; ctx.fillText('PEDIDO #' + d.numero, W - M, y); ctx.textAlign = 'left'; }
    y += 92; ajustar(d.nombre || 'Nombre', 800, 74, W - 2 * M, 40); ctx.fillStyle = NAVY; ctx.fillText(d.nombre || 'Nombre', M, y);
    y += 102; ajustar('Tel: ' + d.tel, 800, 66, W - 2 * M, 36); ctx.fillStyle = NARANJA; ctx.fillText('Tel: ' + d.tel, M, y);
    ctx.font = F(600, 54); ctx.fillStyle = NAVY;
    const dl = lineas(d.dir || '', W - 2 * M, 2); dl.forEach((l, i) => { y += i ? 64 : 92; ctx.fillText(l, M, y); });
    // ciudad y departamento
    const by = y + 48, bh = 170;
    ctx.fillStyle = AZUL; redondo(M, by, W - 2 * M, bh, 32); ctx.fill();
    ctx.textBaseline = 'middle';
    let dw = 0;
    if (d.depto) { ctx.font = F(800, 52); dw = ctx.measureText(d.depto.toUpperCase()).width; ctx.fillStyle = LIMA; ctx.textAlign = 'right'; ctx.fillText(d.depto.toUpperCase(), W - M - 44, by + bh / 2 + 4); }
    ctx.textAlign = 'left'; ajustar((d.ciudad || '').toUpperCase(), 800, 108, W - 2 * M - 88 - (dw ? dw + 50 : 0), 40);
    ctx.fillStyle = '#fff'; ctx.fillText((d.ciudad || '').toUpperCase(), M + 44, by + bh / 2 + 6);
    // separador y pie
    const py = Math.max(by + bh + 70, 930);
    ctx.strokeStyle = '#9fb0e6'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(M, py); ctx.lineTo(W - M, py); ctx.stroke();
    ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
    ctx.fillStyle = ROSA; ctx.font = F(800, 30); ctx.fillText('CONTENIDO', M, py + 60); ctx.fillText('DE', 1190, py + 60);
    // contenido en una sola línea (se achica; si aún no cabe, se corta con …)
    ctx.fillStyle = NAVY; ajustar(d.cont || '', 600, 42, 1060, 30);
    ctx.fillText(lineas(d.cont || '', 1060, 1)[0] || '', M, py + 118);
    // cobro
    const cy = H - 114, txt = d.cobrar ? 'COBRAR ' + pesos(d.cobrar) + ' AL ENTREGAR' : 'SIN COBRO · NO RECAUDO';
    ctx.font = F(800, 32); const cw = Math.max(640, ctx.measureText(txt).width + 80);
    ctx.fillStyle = d.cobrar ? NARANJA : LIMA; redondo(M, cy, cw, 62, 31); ctx.fill();
    ctx.fillStyle = d.cobrar ? '#fff' : NAVY; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(txt, M + cw / 2, cy + 33);
    // remitente
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = NAVY; ctx.font = F(800, 38); ctx.fillText('Wuuff Puppy · Angie Monroy', 1190, py + 118);
    ctx.font = F(600, 36); ctx.fillText('WhatsApp +57 317 643 1286', 1190, py + 166); ctx.fillText('@wuuffpuppy · wuuffpuppy.co', 1190, py + 212);
  }

  // Borrar un pedido (por ejemplo, los de prueba). Pide confirmación; si fue una venta que no se dio, mejor "Cancelado".
  async function borrarPedido(id) {
    const p = pedidos.find(x => x.id === id); if (!p) return;
    const quien = (p.cliente && p.cliente.nombre) || 'sin nombre';
    if (!confirm('¿Borrar el pedido de ' + quien + ' (' + pesos(p.totalCents) + ')?\n\nNo se puede deshacer. Si es una venta que no se dio, mejor márcalo como Cancelado.')) return;
    try { await api('POST', { accion: 'borrar', id: id }); pedidos = pedidos.filter(x => x.id !== id); cerrarHoja(); pintar(); toast('Pedido borrado'); } catch (err) { toast(err.message); }
  }
  function tarjeta(p) {
    const e = EST[p.estado] || EST.confirmado, sig = siguienteEstado(p), c = p.cliente || {};
    return `<article class="pedido" data-id="${esc(p.id)}">
      <div class="arriba">
        <div class="nombre">${p.numero ? `<span class="num-pedido">#${p.numero}</span> ` : ''}${esc(c.nombre || 'Sin nombre')}<small>${esc(ORIGENES[p.origen] || p.origen)} · ${esc(hace(p.creado))}${c.ciudad ? ' · ' + esc(c.ciudad) : ''}</small></div>
        <div class="total">${pesos(p.totalCents)}<button type="button" class="btn-borrar" data-accion="etiqueta" aria-label="Etiqueta para el paquete" title="Etiqueta para el paquete">🏷️</button><button type="button" class="btn-borrar" data-accion="borrar" aria-label="Borrar este pedido" title="Borrar pedido">🗑</button></div>
      </div>
      <div class="prod">${esc(p.productos || '—')}</div>
      <div class="etiquetas">
        <span class="pill e-${esc(p.estado)}">${e.i} ${esc(e.n)}</span>
        <span class="pill ${p.pagado ? 'p-si' : 'p-no'}">${p.pagado ? '✓ Pagado' : (p.pago === 'contraentrega' ? '💵 Cobrar al entregar' : '✗ Sin pagar')}</span>
        ${atrasado(p) ? `<span class="pill atraso">⚠️ ${diasHabiles(p.creado)} días hábiles</span>` : ''}
        ${p.guia && p.guia.numero ? `<span class="pill">Guía ${esc(p.guia.numero)}</span>` : ''}
        ${p.resenaPedida ? '<span class="pill p-si">⭐ Reseña pedida</span>' : ''}
        ${p.regaloSorpresa ? '<span class="pill sorpresa">🎁 PRIMER PEDIDO · regalo sorpresa</span>' : (p.promo ? '<span class="pill bwf">🖤 Black Wuuff</span>' : '')}
        ${p.tipo && p.tipo !== 'venta' ? `<span class="pill t-${esc(p.tipo)}">${esc(TIPOS[p.tipo] || '')}</span>` : ''}
      </div>
      ${sig ? `<div class="siguiente">
        ${c.telefono ? `<a class="btn verde" data-accion="wa" href="${waUrl(p)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${p.estado === 'por-confirmar' ? '✅ Confirmar' : 'WhatsApp'}</a>` : ''}
        <button class="btn claro" data-accion="avanzar" style="flex:1">${EST[sig].i} Marcar ${esc(EST[sig].n.toLowerCase())}</button>
      </div>` : `<div class="siguiente">${p.estado === 'entregado' ? botonResena(p) : ''}<button class="btn claro" data-accion="abrir" style="flex:1">↩ Cambiar estado o editar</button></div>`}
    </article>`;
  }

  // Mensaje de confirmación con todos los datos del pedido (botón "✅ Confirmar por WhatsApp")
  function mensajeConfirmacion(p) {
    const c = p.cliente || {}, n = primerNombre(c.nombre);
    const productos = String(p.productos || '').split('\n').map(l => l.split(' | ')[0].trim()).filter(Boolean);
    const bogota = /bogot/i.test(c.ciudad || '') && !/soacha/i.test(c.ciudad || '');
    const conPlaca = /placa/i.test(p.productos || '');
    const pago = p.pagado ? '✅ Pago recibido, ¡gracias!'
      : (p.pago === 'contraentrega' ? `💵 Pagas ${pesos(p.totalCents)} en efectivo cuando lo recibas`
        : `💳 Falta el pago${PAGOS[p.pago] && p.pago !== 'otro' ? ' por ' + PAGOS[p.pago].replace(/^\S+\s/, '') : ''}`);
    const dir = [c.direccion, c.ciudad].filter(Boolean).join(', ');
    return `¡Hola${n ? ' ' + n : ''}! 🐾 Te escribo de Wuuff Puppy para confirmar tu pedido${p.numero ? ' #' + p.numero : ''}:\n\n` +
      `🛍️ ${productos.length > 1 ? 'Productos:\n' + productos.map(l => '• ' + l).join('\n') : (productos[0] || 'Tu pedido')}\n` +
      (p.mascota ? `🐶 Para: ${p.mascota}\n` : '') +
      (p.promo ? `🖤 Black Wuuff Friday: el nombre fue por nuestra cuenta y te llevas stickers de la pandilla Wuuff de regalo\n` : '') +
      (p.regaloSorpresa ? `🎁 ¡Y fuiste el primer pedido del Black Wuuff: te llevas un regalo sorpresa!\n` : '') +
      `💰 Total: ${pesos(p.totalCents)}\n${pago}\n` +
      (dir ? `📍 Envío a: ${dir}\n` : '') +
      `📅 Te llega en ${bogota ? '2 a 5' : '3 a 6'} días hábiles después de confirmar${conPlaca ? ' (la placa la hacemos en 3 días hábiles)' : ''}\n\n` +
      `¿Me confirmas que los datos están bien${p.pago === 'contraentrega' && !p.pagado ? ' y que habrá alguien para recibir' : ''}? Responde SÍ y lo despachamos 💛`;
  }
  // Reseña en Google (enlace directo para escribirla, del Perfil de Negocio)
  const RESENA_GOOGLE = 'https://g.page/r/CYtp9VSFSfteEBM/review';
  function mensajeResena(p) {
    const n = primerNombre(p.cliente && p.cliente.nombre), m = p.mascota || 'tu perrito';
    return `¡Hola${n ? ' ' + n : ''}! 🐾 Te escribimos de Wuuff Puppy. ¿Cómo le ha ido a ${m} con su Wuuff?\n\n` +
      `Si te gustó, ¿nos ayudas con una reseña en Google? Toma un minuto y nos ayuda muchísimo a que más familias nos conozcan 💛\n` +
      `⭐ ${RESENA_GOOGLE}\n\nY si nos mandas una foto de ${m} con su Wuuff, ¡nos alegras el día! 📸`;

  // ── Hoja: detalle ──

  function opciones(obj, sel) { return Object.entries(obj).map(([k, v]) => `<option value="${k}"${k === sel ? ' selected' : ''}>${esc(v)}</option>`).join(''); }

  // ── "🎨 Cómo armarlo": collares con letras (cada letra con su color, en orden) y placas (forma, colores y nombre) ──
  // Collares: de los productos elegidos (p.inv: nombre { texto, color, mezcla }); placas: del texto del pedido
  // ("Placa Inteligente Wuuff Huella "Toby" (placa Morado, letras Blanco)"), así sirve también para los pedidos viejos.
  const PLACA_HEX = { Morado: '#6E4AA0', Azul: '#3160A6', Blanco: '#F5F5F2', Rojo: '#D3262E' };
  function colorPorNombre(n) {
    if (PLACA_HEX[n]) return { nombre: n, main: PLACA_HEX[n], edge: n === 'Blanco' ? '#cfcfc8' : PLACA_HEX[n] };
    const c = CN_COLORES.find(x => x.nombre === n); return c && c.main ? c : { nombre: n || '—', main: '#cccccc', edge: '#999999' };
  }
  function claro(hex) { const h = String(hex || '#000').replace('#', ''); const r = parseInt(h.substr(0, 2), 16), g = parseInt(h.substr(2, 2), 16), b = parseInt(h.substr(4, 2), 16); return (0.299 * r + 0.587 * g + 0.114 * b) > 170; }
  function armadoCollares(p) {
    return (p.inv || []).filter(it => it.nombre && it.nombre.texto).map(it => {
      const base = CN_COLORES.find(c => c.id === it.nombre.color) || { id: it.nombre.color, nombre: it.nombre.color, main: '#ccc', edge: '#999' };
      const mez = it.nombre.mezcla || [];
      const piezas = Array.from(String(it.nombre.texto).toUpperCase()).map((ch, i) => ({ ch, c: CN_COLORES.find(c => c.id === mez[i]) || base }));
      const usados = piezas.map(x => x.c.nombre).filter((n, i, a) => a.indexOf(n) === i);
      const prod = (CATALOGO.find(c => c.id === it.p) || { n: it.p }).n + (it.talla ? (it.talla.length === 2 ? ' · Talla collar ' + it.talla[0] + ', arnés ' + it.talla[1] : ' · Talla ' + it.talla) : '') + (it.q > 1 ? ' · x' + it.q : '');
      return `<div class="armar-item"><p class="armar-t">${esc(prod)}</p>
        <div class="cn armar-cn"><div class="cn-stage"><div class="cn-box"><div class="cn-strap"><div class="cn-name" data-armar-nombre style="--c:${esc(base.main)};--e:${esc(base.edge || base.main)}">${piezas.map((x, i) => `<span class="cn-ch" title="${i + 1}. ${esc(x.ch)} · ${esc(x.c.nombre)}" style="--c:${esc(x.c.main)};--e:${esc(x.c.edge || x.c.main)}">${x.ch === '♥' || x.ch === '★' ? `<svg class="cn-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="${x.ch === '♥' ? 'M12 21s-7.5-4.6-9.6-9.2C.9 8.4 2.7 4.5 6.4 4.5c2.1 0 3.8 1.2 5.6 3.3 1.8-2.1 3.5-3.3 5.6-3.3 3.7 0 5.5 3.9 4 7.3C19.5 16.4 12 21 12 21z' : 'M12 2.6l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.2 1.2-6.5L2.5 9.5l6.6-.9z'}"/></svg>` : esc(x.ch)}</span>`).join('')}</div></div></div></div></div>
        <p class="armar-d">${piezas.map((x, i) => `<b>${i + 1}.</b> ${esc(x.ch)} ${esc(x.c.nombre.toLowerCase())}`).join(' · ')}</p>
        <p class="nota-chica">${usados.length > 1 ? '🎨 Letras combinadas: ' + esc(usados.join(', ')) : 'Todas las letras en ' + esc(usados[0].toLowerCase())}</p></div>`;
    });
  }
  function svgPlaca(forma, base, letras, nombre) {
    const bc = colorPorNombre(base), lc = colorPorNombre(letras || 'Blanco');
    const n = String(nombre || ''), fs = Math.max(12, Math.min(26, Math.round(150 / Math.max(n.length, 1))));
    const borde = bc.main.toLowerCase() === '#f5f5f2' ? '#cfcfc8' : 'rgba(0,0,0,.15)';
    const figura = forma === 'Gato'
      ? `<polygon points="22,46 28,6 54,30" fill="${bc.main}" stroke="${borde}"/><polygon points="98,46 92,6 66,30" fill="${bc.main}" stroke="${borde}"/><circle cx="60" cy="68" r="44" fill="${bc.main}" stroke="${borde}"/>`
      : forma === 'Nombre' ? `<rect x="4" y="38" width="112" height="48" rx="24" fill="${bc.main}" stroke="${borde}"/>`
        : `<circle cx="27" cy="44" r="13" fill="${bc.main}" stroke="${borde}"/><circle cx="47" cy="26" r="13" fill="${bc.main}" stroke="${borde}"/><circle cx="73" cy="26" r="13" fill="${bc.main}" stroke="${borde}"/><circle cx="93" cy="44" r="13" fill="${bc.main}" stroke="${borde}"/><ellipse cx="60" cy="80" rx="38" ry="31" fill="${bc.main}" stroke="${borde}"/>`;
    const ty = forma === 'Gato' ? 74 : forma === 'Nombre' ? 63 : 84;
    return `<svg viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Placa ${esc(forma)} ${esc(base)} con el nombre ${esc(n)} en ${esc(letras || '')}">${figura}<text x="60" y="${ty}" text-anchor="middle" dominant-baseline="middle" font-family="Nunito,sans-serif" font-weight="900" font-size="${fs}" fill="${lc.main}" stroke="${claro(lc.main) && claro(bc.main) ? '#888' : 'none'}" stroke-width=".6">${esc(n)}</text></svg>`;
  }
  function armadoPlacas(p) {
    const re = /Placa Inteligente Wuuff (Huella|Gato|Nombre) "([^"]+)" \(placa ([^,)]+)(?:, letras ([^,)]+))?(?:, tel atrás ([\d ]+))?\)/g;
    const out = []; let m;
    while ((m = re.exec(p.productos || ''))) {
      const [, forma, nombre, base, letras, tel] = m;
      const telTxt = tel ? (d => d.length === 10 ? d.slice(0, 3) + ' ' + d.slice(3, 6) + ' ' + d.slice(6) : d)(tel.replace(/\D/g, '')) : '';
      out.push(`<div class="armar-item armar-placa"><div class="armar-svg" data-placa="${esc(JSON.stringify({ forma, nombre, base: base.trim(), letras: (letras || '').trim() }))}">${svgPlaca(forma, base.trim(), (letras || '').trim(), nombre)}</div><div><p class="armar-t">Placa ${esc(forma.toLowerCase())} · "${esc(nombre)}"</p>

    }
    return out;

  // Forma exacta de la placa: la misma geometría del diseñador (placa-nfc/js/geom.js + ClipperLib + letras).
  // Se carga solo la primera vez que se abre un pedido con placa; mientras tanto se ve el dibujo aproximado.
  let geomPromesa = null;
  function cargarScript(src) { return new Promise((ok, mal) => { const sc = document.createElement('script'); sc.src = src; sc.onload = ok; sc.onerror = mal; document.head.appendChild(sc); }); }
  function cargarGeom() {
    if (!geomPromesa) geomPromesa = Promise.all([
      window.ClipperLib ? null : cargarScript('https://cdn.jsdelivr.net/npm/clipper-lib@6.4.2/clipper.js'),
      window.WuuffGeom ? null : cargarScript('/placa-nfc/js/geom.js?v=20261122'),
      fetch('/placa-nfc/datos/glyphs.json').then(r => r.json())
    ]).then(r => window.WuuffGeom(window.ClipperLib, r[2])).catch(err => { geomPromesa = null; throw err; });
    return geomPromesa;
  }
  function svgPlacaExacta(G, d) {
    const n = String(d.nombre || '').trim();
    const g = d.forma === 'Nombre' ? G.placaSilueta(n) : G.placaFigura(d.forma.toLowerCase(), n);
    const bb = G.bounds(g.base), pad = 2, W = bb.w + 2 * pad, H = bb.h + 2 * pad;
    const ruta = paths => G.formas(paths).map(f => [f.exterior, ...f.huecos].map(q => 'M' + q.map(([x, y]) => `${(x - bb.x0 + pad).toFixed(2)},${(bb.y1 - y + pad).toFixed(2)}`).join('L') + 'Z').join('')).join('');
    const bc = colorPorNombre(d.base), lc = colorPorNombre(d.letras || 'Blanco');
    const borde = claro(bc.main) ? 'rgba(0,0,0,.35)' : 'rgba(0,0,0,.15)';
    return `<svg viewBox="0 0 ${W.toFixed(2)} ${H.toFixed(2)}" role="img" aria-label="Placa ${esc(d.forma)} ${esc(d.base)} con ${esc(n)} en ${esc(d.letras || '')}"><path fill-rule="evenodd" fill="${bc.main}" stroke="${borde}" stroke-width=".5" d="${ruta(g.base)}"/><path fill-rule="evenodd" fill="${lc.main}" stroke="${claro(lc.main) && claro(bc.main) ? 'rgba(0,0,0,.35)' : 'none'}" stroke-width=".3" d="${ruta(g.letras)}"/></svg>`;
  }
  function ajustarCollares() {
    document.querySelectorAll('[data-armar-nombre]').forEach(name => {
      const strap = name.parentNode, n = name.children.length || 1;
      let fs = Math.max(26, Math.min(110, strap.clientWidth * 0.76 / (n * 0.68)));
      name.style.setProperty('--fs', fs + 'px');
      const max = strap.clientWidth * 0.84;
      if (name.scrollWidth > max) { fs = Math.max(20, fs * max / name.scrollWidth); name.style.setProperty('--fs', fs + 'px'); }
      strap.style.height = Math.max(16, fs * 0.5) + 'px';
    });
  }
  function pintarPlacasExactas() {
    const cajas = document.querySelectorAll('.armar-svg[data-placa]');

    return `${celular ? '<p class="nota-chica" style="margin:-4px 0 6px">👉 Desliza la tabla para ver lo que llegó y lo que salió.</p>' : ''}
      <div class="tabla-caja"><table class="hc">
        <thead><tr><th>Producto</th>${orden.map(c => `<th class="${c.cls === 'hc-q' || c.cls === 'hc-d' ? c.cls : ''}" data-col="${c.k}">${c.n}</th>`).join('')}</tr></thead>
        <tbody>${it.map(x => `<tr class="${x.disponible <= 0 ? 'agotado' : (x.disponible <= 3 ? 'pocos' : '')}">
          <td>${esc(x.nombre)}${x.extra ? ` <button class="quitar" data-quitar-prod="${esc(x.id)}" title="Quitar del inventario" aria-label="Quitar ${esc(x.nombre)}">✕</button>` : ''}</td>
          ${orden.map(c => `<td class="${c.cls}${verCelda(x, c.k) ? ' ver' : ''}" data-col="${c.k}"${verCelda(x, c.k) ? ` data-ver="${esc(x.id)}" title="Ver de dónde sale"` : ''}>${c.v(x)}</td>`).join('')}</tr>`).join('')}</tbody>
        <tfoot><tr><td>Total</td>${orden.map(c => `<td class="${c.cls}" data-col="${c.k}">${c.t(it)}</td>`).join('')}</tr></tfoot>
      </table></div>`;
  }
  let anchoAntes = window.innerWidth < 760;
  window.addEventListener('resize', () => { const a = window.innerWidth < 760; if (a !== anchoAntes && inv && pestana === 'inventario') { anchoAntes = a; pintarInventario(); } });

  function pintarInventario() {
    const v = $('vistaInventario'), it = inv.items || [];
    const hoy = mesDe(new Date().toISOString()), d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - 1);
    const pasado = mesDe(d.toISOString());
    const meses = { este: hoy, pasado, todo: '' };
    const salidas = (inv.salidas || []).filter(s => !meses[invMes] || mesDe(s.fecha) === meses[invMes]);
    const cols = [['venta', 'Vendido'], ['colaboracion', 'Colab.'], ['regalo', 'Regalos'], ['contenido', 'Contenido'], ['danado', 'Dañados']];
    const suma = (item, tipo) => salidas.filter(s => s.item === item && s.tipo === tipo).reduce((n, s) => n + s.cantidad, 0);
    const filas = it.map(x => ({ x, c: cols.map(([t]) => suma(x.id, t)) })).filter(f => f.c.some(Boolean));
    const nombre = id => {
      const l = /^L-([a-z]+)-(.+)$/.exec(id);
      if (l) { const c = CN && CN.colores.find(x => x.id === l[1]); const ch = l[2] === 'corazon' ? 'Corazón' : (l[2] === 'estrella' ? 'Estrella' : 'Letra ' + l[2]); return ch + ' ' + (c ? c.nombre.toLowerCase() : l[1]); }
      return (it.find(x => x.id === id) || {}).nombre || id;
    };
    v.innerHTML = `
      ${inv.conDatos ? '' : '<p class="aviso" style="margin:4px 0 12px">👋 Para empezar, toca <b>📥 Llegó producto</b> y escribe el total que llegó de China de cada producto. Desde ahí la tabla se calcula sola con lo que se vende, regala o usa.</p>'}
      <div class="inv-acciones">
        <button class="btn naranja" data-mov="entrada">📥 Llegó producto</button>
        <button class="btn claro" data-mov="colaboracion">🤝 Colaboración</button>
        <button class="btn claro" data-mov="regalo">🎁 Regalo</button>
        <button class="btn claro" data-mov="contenido">🎬 Contenido</button>
        <button class="btn claro" data-mov="danado">⚠️ Dañado o perdido</button>
      </div>
      <div class="caja hoja-calc">
        <h3>📦 Lo que tengo</h3>
        <p class="nota-chica" style="margin:-4px 0 10px">Se calcula solo: <b>Llegó − Vendidos − Colaboración − Regalos − Contenido − Dañados = Quedan</b>. Los vendidos salen de los pedidos enviados o entregados; lo que está por despachar ya está apartado.</p>
        ${hojaCalc(it)}
      </div>
      <button class="btn claro" id="btnProducto" style="margin:-6px 0 16px">＋ Agregar otro producto al inventario</button>

      <div class="caja"><h3>🔤 Letras del collar con nombre</h3>
        <p class="nota-chica" style="margin:-4px 0 8px">Elige la letra y el color para ver cuántas hay. Las de los pedidos con collar con nombre se descuentan solas al enviarlos.</p>
        <div id="invLetras"></div>
      </div>

      <div class="caja">
        <h3>📊 Lo que salió</h3>
        <div class="filtros" style="padding-top:0">${[['este', 'Este mes'], ['pasado', 'Mes pasado'], ['todo', 'Todo']].map(([k, n]) => `<button class="chip${invMes === k ? ' activo' : ''}" data-mes="${k}">${n}</button>`).join('')}</div>
        <p class="nota-chica" style="margin:-4px 0 8px">${invMes === 'todo' ? 'Desde que empezaste a usar el panel.' : 'En ' + esc(mesTexto(meses[invMes])) + '.'} Las ventas salen de los pedidos <b>enviados o entregados</b>; colaboraciones y regalos, de los pedidos con ese tipo y de lo que anotas aquí.</p>
        ${filas.length ? `<div class="tabla-caja"><table class="tabla"><thead><tr><th>Producto</th>${cols.map(c => `<th>${c[1]}</th>`).join('')}</tr></thead><tbody>
          ${filas.map(f => `<tr><td>${esc(f.x.nombre)}</td>${f.c.map(n => `<td>${n || '—'}</td>`).join('')}</tr>`).join('')}
          <tr class="total"><td>Total</td>${cols.map((c, i) => `<td>${filas.reduce((n, f) => n + f.c[i], 0)}</td>`).join('')}</tr></tbody></table></div>`
          : '<p class="nota-chica">Nada en este periodo.</p>'}
      </div>

      ${(inv.sinLeer || []).length ? `<div class="caja"><h3>🤔 Pedidos que no pude leer</h3>
        <p class="nota-chica" style="margin:-4px 0 6px">No entendí qué productos o qué talla llevan, así que no los descuento. Ábrelos y escribe el producto como en el catálogo (ej.: "Arnés tipo H (Talla S)").</p>
        <div class="sin-leer">${inv.sinLeer.map(s => `<button data-abrir="${esc(s.id)}"><b>${esc(s.cliente || 'Sin nombre')}</b> · ${esc(s.productos || '—')}</button>`).join('')}</div></div>` : ''}

      <div class="caja"><h3>🕑 Movimientos</h3>
        ${(inv.movimientos || []).length ? `<div class="movs-sel"><label><input type="checkbox" id="movTodos"> Seleccionar todos</label><button class="btn rojo" id="btnBorrarSel" disabled>🗑 Borrar seleccionados</button></div>
          <ul class="movs">${inv.movimientos.map(m => `<li><input type="checkbox" class="mov-check" value="${esc(m.id)}" aria-label="Seleccionar"><span>${MOV[m.tipo] ? MOV[m.tipo].i : '🔢'} <b>${m.tipo === 'conteo' ? 'Conteo: ' + m.cantidad + ' <span style="color:#b3261e;font-weight:700">(ya no se usa: bórralo)</span>' : (m.tipo === 'entrada' ? '+' : '−') + m.cantidad}</b> ${esc(nombre(m.item))}
          <small>${esc(fecha(m.fecha))}${m.nota ? ' · ' + esc(m.nota) : ''}</small></span><button class="btn-borrar" data-borrar-mov="${esc(m.id)}" aria-label="Borrar movimiento" title="Borrar">🗑</button></li>`).join('')}</ul>`
          : '<p class="nota-chica">Aún no hay movimientos.</p>'}
      </div>`;
    v.querySelectorAll('[data-mov]').forEach(b => b.onclick = () => abrirMovimiento(b.dataset.mov));
    // Seleccionar varios movimientos y borrarlos juntos
    const checks = () => Array.from(v.querySelectorAll('.mov-check'));
    const marcar = () => {
      const n = checks().filter(c => c.checked).length, b = $('btnBorrarSel'), todos = $('movTodos');
      if (b) { b.disabled = !n; b.textContent = n ? '🗑 Borrar ' + n + (n === 1 ? ' seleccionado' : ' seleccionados') : '🗑 Borrar seleccionados'; }
      if (todos) todos.checked = n > 0 && n === checks().length;
    };
    checks().forEach(c => c.onchange = marcar);
    if ($('movTodos')) $('movTodos').onchange = e => { checks().forEach(c => { c.checked = e.target.checked; }); marcar(); };
    if ($('btnBorrarSel')) $('btnBorrarSel').onclick = async () => {
      const ids = checks().filter(c => c.checked).map(c => c.value);
      if (!ids.length || !confirm('¿Borrar ' + ids.length + (ids.length === 1 ? ' movimiento' : ' movimientos') + ' del inventario?')) return;
      if (await cargarInventario({ accion: 'inv-borrar', ids })) toast(ids.length + (ids.length === 1 ? ' movimiento borrado' : ' movimientos borrados'));
    };
    v.querySelectorAll('[data-mes]').forEach(b => b.onclick = () => { invMes = b.dataset.mes; pintarInventario(); });
    v.querySelectorAll('[data-abrir]').forEach(b => b.onclick = () => abrirDetalle(b.dataset.abrir));
    v.querySelectorAll('[data-borrar-mov]').forEach(b => b.onclick = async () => {
      if (!confirm('¿Borrar este movimiento del inventario?')) return;
      if (await cargarInventario({ accion: 'inv-borrar', id: b.dataset.borrarMov })) toast('Movimiento borrado');
    });
    v.querySelectorAll('td[data-ver]').forEach(td => td.onclick = () => abrirOrigen(td.dataset.ver, td.dataset.col));
    v.querySelectorAll('[data-quitar-prod]').forEach(b => b.onclick = async () => {
      if (!confirm('¿Quitar este producto del inventario?')) return;
      if (await cargarInventario({ accion: 'inv-quitar-producto', id: b.dataset.quitarProd })) toast('Producto quitado');
    });
    pintarLetras();
    $('btnProducto').onclick = async () => {
      const n = prompt('Nombre del producto (ej.: Bolsas de regalo, Letras rosadas…)');
      if (n && n.trim() && await cargarInventario({ accion: 'inv-producto', nombre: n.trim() })) toast('Producto agregado');
    };
  }
  // Formulario de movimiento. opciones: { items: [{ id, nombre, bodega }], titulo, ayuda } (por defecto, los productos)
  function abrirMovimiento(tipo, opciones) {
    const o = opciones || {};
    const lote = Date.now().toString(36) + Math.random().toString(36).slice(2, 8); // si este formulario se guarda dos veces, no se duplica
    const it = o.items || (inv && inv.items) || [], hoy = new Date(Date.now() - 5 * 36e5).toISOString().slice(0, 10);
    const nombreDe = id => (it.find(x => x.id === id) || {}).nombre || id;
    abrirHoja(`
      <div class="cab"><h2>${MOV[tipo].i} ${esc(o.titulo || MOV[tipo].n)}</h2><button class="btn claro icono" data-cerrar aria-label="Cerrar">✕</button></div>
      <form id="formMov">
        <div class="caja">
          <label for="mTipo">Qué pasó</label>
          <select id="mTipo">${Object.entries(MOV).map(([k, m]) => `<option value="${k}"${k === tipo ? ' selected' : ''}>${m.i} ${esc(m.n)}</option>`).join('')}</select>
          <h3 style="margin-top:14px" id="mTitulo">${esc(MOV[tipo].t)}</h3>
          <p class="nota-chica" id="mAyuda" style="margin:-4px 0 4px"></p>
          <div class="cantidades">${it.map(x => `<div class="cant"><span>${x.html || esc(x.nombre)} <small style="color:var(--gris)">(hay ${x.bodega || 0})</small></span>
            <button type="button" data-menos="${esc(x.id)}" aria-label="Menos">−</button><input type="number" min="0" inputmode="numeric" data-item="${esc(x.id)}" placeholder="—" aria-label="${esc(x.nombre)}"${x.valor != null ? ` value="${x.valor}"` : ''}><button type="button" data-mas="${esc(x.id)}" aria-label="Más">＋</button></div>`).join('')}</div>
        </div>
        <div class="caja">
          <div class="dos">
            <div><label for="mFecha">Fecha</label><input id="mFecha" type="date" value="${hoy}" max="${hoy}"></div>
            <div><label for="mNota">Nota</label><input id="mNota" maxlength="200" placeholder="${esc(MOV[tipo].nota)}"></div>
          </div>
        </div>
        <button class="btn naranja ancho" type="submit">Revisar y guardar</button>
      </form>
      <div id="mConfirmar" class="oculto"></div>`);
    const h = $('hoja');
    h.querySelector('[data-cerrar]').onclick = cerrarHoja;
    const campo = id => h.querySelector(`input[data-item="${id}"]`);
    h.querySelectorAll('[data-mas]').forEach(b => b.onclick = () => { const c = campo(b.dataset.mas); c.value = (parseInt(c.value, 10) || 0) + 1; });
    h.querySelectorAll('[data-menos]').forEach(b => b.onclick = () => { const c = campo(b.dataset.menos), n = (parseInt(c.value, 10) || 0) - 1; c.value = n > 0 ? n : (c.value === '' ? '' : 0); });
    // Ayuda según lo que pasó: "Llegó producto" suma a "Llegó"; lo demás resta
    const ayuda = t => o.ayuda && t === tipo ? esc(o.ayuda) : (t === 'entrada' ? 'Escribe <b>cuántas llegaron</b> (de China o de otro pedido al proveedor). <b>Se suma</b> a la columna "Llegó". Deja vacío lo que no llegó.'
      : 'Se resta de lo que hay (columna ' + esc(MOV[t].n) + '). Deja vacío lo que no aplica.');
    $('mAyuda').innerHTML = ayuda(tipo);
    $('mTipo').onchange = () => { const m = MOV[$('mTipo').value]; $('mTitulo').textContent = m.t; $('mNota').placeholder = m.nota; $('mAyuda').innerHTML = ayuda($('mTipo').value); h.querySelector('.cab h2').textContent = m.i + ' ' + (o.titulo || m.n); };
    // Paso 1: revisar. Paso 2: confirmar (así se ve exactamente lo que se va a guardar, una sola vez)
    $('formMov').onsubmit = e => {
      e.preventDefault();
      const t = $('mTipo').value;
      const movs = Array.from(h.querySelectorAll('input[data-item]')).filter(c => c.value !== '' && +c.value > 0)
        .map(c => ({ tipo: t, item: c.dataset.item, cantidad: +c.value, fecha: $('mFecha').value, nota: $('mNota').value.trim(), lote }));
      if (!movs.length) { toast('Escribe al menos una cantidad'); return; }
      const signo = t === 'entrada' ? '+' : '−';
      const fechaTxt = new Date($('mFecha').value + 'T12:00:00').toLocaleDateString('es-CO', { weekday: 'long', day: 'numeric', month: 'long' });
      const total = movs.reduce((n, m) => n + m.cantidad, 0);
      const bodegaDe = id => (it.find(x => x.id === id) || {}).bodega || 0;
      // Movimientos iguales ya guardados (mismo tipo, producto, cantidad y día): para no registrar dos veces lo mismo
      const diaDe = iso => new Date(new Date(iso).getTime() - 5 * 36e5).toISOString().slice(0, 10);
      const repetidos = movs.filter(m => ((inv && inv.movimientos) || []).some(x => x.tipo === t && x.item === m.item && x.cantidad === m.cantidad && diaDe(x.fecha) === m.fecha));
      $('formMov').classList.add('oculto');
      const c = $('mConfirmar'); c.classList.remove('oculto');
      c.innerHTML = `<div class="caja confirmar">
          <h3>${MOV[t].i} ¿Guardamos esto?</h3>
          <p class="nota-chica" style="margin:-4px 0 8px">${esc(MOV[t].n)} · ${esc(fechaTxt)}${movs[0].nota ? ' · ' + esc(movs[0].nota) : ''}</p>
          ${repetidos.length ? `<p class="aviso" style="background:#fde7e1;margin:0 0 8px">⚠️ <b>Ojo:</b> ya registraste esto mismo ese día (${repetidos.map(m => signo + m.cantidad + ' ' + esc(nombreDe(m.item))).slice(0, 3).join(', ')}${repetidos.length > 3 ? '…' : ''}). Si es el mismo producto, no lo guardes otra vez.</p>` : ''}
          <ul class="resumen-mov">${movs.map(m => { const hay = bodegaDe(m.item), queda = t === 'entrada' ? hay + m.cantidad : hay - m.cantidad;
            return `<li><span>${esc(nombreDe(m.item))}<small class="queda">hay ${hay} → quedarán <b>${queda}</b></small></span><b>${signo + m.cantidad}</b></li>`; }).join('')}</ul>
          <p class="nota-chica">Total: <b>${signo}${total}</b> ${total === 1 ? 'unidad' : 'unidades'}.</p>
        </div>
        <button class="btn naranja ancho" type="button" id="mSi">✅ Sí, guardar</button>
        <button class="btn claro ancho" type="button" id="mCorregir" style="margin-top:8px">✏️ Corregir</button>`;
      $('mCorregir').onclick = () => { c.classList.add('oculto'); $('formMov').classList.remove('oculto'); };
      $('mSi').onclick = async () => {
        const btn = $('mSi');
        if (btn.disabled) return;
        btn.disabled = true; $('mCorregir').disabled = true; btn.textContent = 'Guardando…';
        if (await cargarInventario({ accion: 'inv-guardar', movs })) { cerrarHoja(); toast(MOV[t].i + ' Guardado en el inventario'); }
        else { btn.disabled = false; $('mCorregir').disabled = false; btn.textContent = '✅ Sí, guardar'; }
      };
    };
  }

  // ── Letras del collar con nombre: por letra y color ──
  const LETRAS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').concat(['♥', '★']);
  const codLetra = ch => ch === '♥' ? 'corazon' : (ch === '★' ? 'estrella' : ch);
  const idLetra = (color, ch) => 'L-' + color + '-' + codLetra(ch);
  let CN = null, letraSel = 'A', colorSel = 'rosado';
  function cargarCN() {
    if (CN) return Promise.resolve(CN);
    return fetch('/assets/collar-nombre.json').then(r => r.json()).then(j => { CN = j; return j; });
  }
  function datoLetra(color, ch) {
    return (inv.letras || []).find(x => x.id === idLetra(color, ch)) || { llego: 0, venta: 0, colaboracion: 0, regalo: 0, contenido: 0, danado: 0, bodega: 0, porDespachar: 0, disponible: 0 };
  }
  function burbuja(ch, col, tam) {
    return `<span class="burbuja" style="--c:${col.main};--b:${col.edge};font-size:${tam || 30}px">${esc(ch)}</span>`;
  }
  function pintarLetras() {
    const caja = $('invLetras'); if (!caja) return;
    if (!CN) { caja.innerHTML = '<p class="nota-chica">Cargando letras…</p>'; cargarCN().then(pintarInventario).catch(() => { caja.innerHTML = '<p class="nota-chica">No se pudieron cargar los colores.</p>'; }); return; }
    const col = CN.colores.find(c => c.id === colorSel) || CN.colores[0];
    const d = datoLetra(col.id, letraSel);
    const clase = n => n <= 0 ? 'agotada' : (n <= 2 ? 'pocas' : '');
    caja.innerHTML = `
      <div class="dos">
        <div><label for="lLetra">Letra</label><select id="lLetra">${LETRAS.map(ch => `<option value="${ch}"${ch === letraSel ? ' selected' : ''}>${ch === '♥' ? '♥ Corazón' : (ch === '★' ? '★ Estrella' : ch)}</option>`).join('')}</select></div>
        <div><label for="lColor">Color</label><select id="lColor">${CN.colores.map(c => `<option value="${c.id}"${c.id === col.id ? ' selected' : ''}>${esc(c.nombre)}</option>`).join('')}</select></div>
      </div>
      <div class="letra-res ${clase(d.disponible)}">
        ${burbuja(letraSel, col, 64)}
        <div><b>${d.bodega}</b><span>${letraSel === '♥' ? 'corazones' : (letraSel === '★' ? 'estrellas' : 'letras ' + esc(letraSel))} ${esc(col.nombre.toLowerCase())} en bodega</span>
          <small>Llegaron ${d.llego} · en pedidos −${d.venta + d.colaboracion + d.regalo}${d.contenido ? ' · contenido −' + d.contenido : ''}${d.danado ? ' · dañadas −' + d.danado : ''}${d.porDespachar ? ' · ' + d.porDespachar + ' por despachar' : ''} · ${d.disponible <= 0 ? '⛔ agotada para vender' : d.disponible + ' disponibles'}</small></div>
      </div>
      <div class="letra-acc">
        <button class="btn naranja" data-lmov="entrada">📥 Llegaron</button>
        <button class="btn claro" data-lmov="contenido">🎬 Contenido</button>
        <button class="btn claro" data-lmov="danado">⚠️ Dañadas</button>
      </div>
      <p class="ck-sub" style="margin:14px 0 6px;font-weight:800">Todas las letras en ${esc(col.nombre.toLowerCase())} <small style="color:var(--gris);font-weight:700">· toca una para elegirla</small></p>
      <div class="letras-grid">${LETRAS.map(ch => { const x = datoLetra(col.id, ch); return `<button type="button" class="lg ${clase(x.disponible)}${ch === letraSel ? ' activa' : ''}" data-letra="${ch}">${burbuja(ch, col, 22)}<b>${x.disponible}</b></button>`; }).join('')}</div>
      <div class="letra-acc" style="margin-top:10px">
        <button class="btn claro" id="lLlegaronColor">📥 Llegaron varias en ${esc(col.nombre.toLowerCase())}</button>
      </div>
      ${(inv.letrasSinLeer || []).length ? `<p class="aviso" style="margin-top:12px">🤔 No pude leer las letras de ${inv.letrasSinLeer.length} pedido${inv.letrasSinLeer.length > 1 ? 's' : ''}: ${inv.letrasSinLeer.slice(0, 4).map(x => esc(x.cliente || 'sin nombre')).join(', ')}. Para que se descuenten solas, escribe el producto así: <i>Collar con nombre "LUNA" (Talla S) · letras Rosado</i>.</p>` : ''}`;
    $('lLetra').onchange = e => { letraSel = e.target.value; pintarLetras(); };
    $('lColor').onchange = e => { colorSel = e.target.value; pintarLetras(); };
    caja.querySelectorAll('[data-letra]').forEach(b => b.onclick = () => { letraSel = b.dataset.letra; pintarLetras(); });
    const unaLetra = () => [{ id: idLetra(col.id, letraSel), nombre: (letraSel === '♥' ? 'Corazón' : (letraSel === '★' ? 'Estrella' : 'Letra ' + letraSel)) + ' ' + col.nombre.toLowerCase(), html: burbuja(letraSel, col, 26) + ' ' + esc(col.nombre), bodega: d.bodega }];
    caja.querySelectorAll('[data-lmov]').forEach(b => b.onclick = () => abrirMovimiento(b.dataset.lmov, { items: unaLetra(), titulo: MOV[b.dataset.lmov].n + ' · ' + unaLetra()[0].nombre }));
    const todoColor = () => LETRAS.map(ch => ({ id: idLetra(col.id, ch), nombre: (ch === '♥' ? 'Corazón' : (ch === '★' ? 'Estrella' : 'Letra ' + ch)) + ' ' + col.nombre.toLowerCase(), html: burbuja(ch, col, 24), bodega: datoLetra(col.id, ch).bodega }));
    $('lLlegaronColor').onclick = () => abrirMovimiento('entrada', { items: todoColor(), titulo: 'Llegaron letras ' + col.nombre.toLowerCase() });
  }

  // Inicio
  if (token && !revisarInactividad()) { usar(); $('app').classList.remove('oculto'); cargar(); } else if (!token) mostrarLogin();
})();
</script>
</body>
</html>
