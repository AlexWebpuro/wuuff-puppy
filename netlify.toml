[build]
  functions = "netlify/functions"
  publish = "."

# wuuffpuppy.com (y www) redirige al dominio principal wuuffpuppy.co, conservando la ruta
[[redirects]]
  from = "https://wuuffpuppy.com/*"
  to = "https://wuuffpuppy.co/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.wuuffpuppy.com/*"
  to = "https://wuuffpuppy.co/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://wuuffpuppy.com/*"
  to = "https://wuuffpuppy.co/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.wuuffpuppy.com/*"
  to = "https://wuuffpuppy.co/:splat"
  status = 301
  force = true

# El arnés cambió de nombre a "arnés tipo H": la URL anterior redirige a la nueva
[[redirects]]
  from = "/arnes-impermeable-perro/*"
  to = "/arnes-tipo-h-impermeable-perro/"
  status = 301
  force = true

[[redirects]]
  from = "/arnes-impermeable-perro"
  to = "/arnes-tipo-h-impermeable-perro/"
  status = 301
  force = true

# Perfil de la mascota de la placa NFC: es la dirección que se graba en el chip
[[redirects]]
  from = "/m/:id/foto"
  to = "/.netlify/functions/perfil-foto/:id?id=:id"
  status = 200
  force = true

[[redirects]]
  from = "/m/:id"
  to = "/.netlify/functions/perfil-ver/:id?id=:id"
  status = 200
  force = true

# La página de edición del perfil y las respuestas del perfil no se indexan ni se guardan en caché
[[headers]]
  for = "/placa-nfc/perfil/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-store"
